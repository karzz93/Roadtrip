<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,interactive-widget=resizes-content">
<title>Roadtrip Companion</title>
<meta name="description" content="A personal road-trip copilot for Southern France, Spain and Portugal.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roadtrip">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101317; --surf:#181D23; --surf2:#20262E; --surf3:#2A323B;
  --line:#2E3742; --line2:#3C4753;
  --txt:#ECEBE6; --txt2:#AFBAC5; --mut:#7F8C99;
  --gold:#E5A83B; --gold-dim:#8A6520; --pine:#5C9C84; --rust:#C4613F; --sky:#6E97C9;
  --on-gold:#1A1206;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  --r:18px; --r-sm:12px; --r-lg:26px;
  --nav-h:calc(58px + env(safe-area-inset-bottom,0px));
  --kb:0px; --sheet-max:92vh;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
}
:root:not([data-theme="dark"]){
  --ink:#F2F1EC; --surf:#FFFFFF; --surf2:#EAE8E1; --surf3:#DFDCD3;
  --line:#DAD6CB; --line2:#C6C1B4;
  --txt:#161A1F; --txt2:#3F4952; --mut:#6C7681;
  --gold:#A9721A; --gold-dim:#E8D6AE; --pine:#3C7761; --rust:#A84A2A; --sky:#3E6796;
  --on-gold:#FFF9EE;
  --shadow:0 10px 24px -14px rgba(20,25,30,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink); color:var(--txt); font-family:var(--body);
  font-size:15.5px; line-height:1.5; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100%;padding-bottom:calc(var(--nav-h) + 8px)}
#view{padding:0 14px 24px;max-width:720px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.12}
h1{font-size:27px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16.5px;font-weight:700}
p{margin:0 0 8px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--txt);background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.mut{color:var(--mut)} .t2{color:var(--txt2)}
.sm{font-size:13px} .xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}
.stack{display:grid;gap:10px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(var(--ink) 72%,transparent);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;max-width:720px;margin:0 auto}
.brandmark{width:30px;height:30px;border-radius:9px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;flex:none}
.brandmark svg{width:18px;height:18px}
.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--gold);color:var(--on-gold);border-color:transparent}

/* ---------- cards ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent}
.card.pad0{padding:0;overflow:hidden}
.sect{margin-top:22px}
.sect>.between{margin-bottom:10px}
.link{color:var(--gold);font-weight:600;font-size:13.5px}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surf2);color:var(--txt2);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--pine);border-color:color-mix(in srgb,var(--pine) 40%,transparent)}
.pill.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.pill.bad{color:var(--rust);border-color:color-mix(in srgb,var(--rust) 40%,transparent)}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 2px;margin:0 -14px}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--surf);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--txt2);min-height:40px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--txt);color:var(--ink);border-color:transparent}
.chip.dog.on{background:var(--pine);color:#fff}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--surf2);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.985)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.qa{display:flex;align-items:center;gap:9px;min-height:52px;padding:0 12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;font-size:13.5px;font-weight:600;text-align:left;line-height:1.2}
.qa span.i{font-size:17px}

/* ---------- day plan cards (the signature element) ---------- */
.plan{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;position:relative;overflow:hidden}
.plan.sel{border-color:var(--gold)}
.plan .tag{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
.plan h2{font-size:21px;margin:2px 0 10px}
.facts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tl{position:relative;padding-left:16px;display:grid;gap:9px}
.tl:before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),color-mix(in srgb,var(--gold) 15%,transparent))}
.tl .stop{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:baseline}
.tl .stop:before{content:"";position:absolute;left:-16px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--surf)}
.tl .t{font-family:var(--display);font-weight:700;font-size:13.5px;color:var(--txt2);font-variant-numeric:tabular-nums}
.tl .n{font-size:14.5px;font-weight:500}
.tl .d{font-size:11.5px;color:var(--mut)}

/* ---------- place cards ---------- */
.thumb{position:relative;width:100%;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
.thumb .gl{position:absolute;inset:0}
.thumb .em{font-size:40px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.thumb .cap{position:absolute;left:10px;bottom:8px;right:10px;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.thumb .badge{position:absolute;right:8px;top:8px}
.hcard{display:grid;grid-template-columns:86px 1fr;gap:0;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;width:100%}
.hcard .th{position:relative;display:grid;place-items:center}
.hcard .th .em{font-size:26px}
.hcard .bd{padding:11px 12px;min-width:0}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 14px 4px;margin:0 -14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;width:214px}

/* ---------- scorecard ---------- */
.score{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.score div{background:var(--surf);padding:9px 11px}
.score .k{font-size:11px;color:var(--mut)}
.score .v{font-size:14px;font-weight:600;font-family:var(--display)}
.verdict{border-left:3px solid var(--gold);padding:2px 0 2px 12px;font-size:15px;line-height:1.45}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,8,10,.62);z-index:60;opacity:0;transition:opacity .2s}
.scrim.in{opacity:1}
/* A bottom-anchored sheet gets pushed behind the Android keyboard, which looks
   like the app has changed screen. On phones the sheet is a full-height panel
   with a sticky header instead: the keyboard simply covers the lower part and
   the form scrolls. Bottom-sheet behaviour returns on wide screens. */
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:61;background:var(--ink);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.in{transform:none}
.sheet .grab{display:none}
.sheet .sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 90px);-webkit-overflow-scrolling:touch}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;flex:none;z-index:2;background:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;border-bottom:1px solid var(--line)}

/* ---------- bottom nav ---------- */
body.kb nav.bn{display:none}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:600;position:relative}
nav.bn button svg{width:23px;height:23px}
nav.bn button.on{color:var(--gold)}
nav.bn button.on:before{content:"";position:absolute;top:0;width:26px;height:2px;border-radius:2px;background:var(--gold)}

/* ---------- map ---------- */
#mapwrap{position:fixed;inset:0;bottom:var(--nav-h);background:var(--surf2)}
#mapcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#mkl{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 4px;rotate:45deg;background:var(--surf);border:1.5px solid var(--line2);box-shadow:0 4px 10px rgba(0,0,0,.45)}
.mk>span{rotate:-45deg;font-size:15px;line-height:1}
.mk.cl{border-radius:50%;rotate:0deg;background:var(--gold);border-color:transparent;color:var(--on-gold);font-family:var(--display);font-weight:800;font-size:14px;width:36px;height:36px}
.mk.sv{border-color:var(--gold)} .mk.vs{border-color:var(--pine)} .mk.pk{background:var(--sky);border-color:transparent}
.maptools{position:absolute;right:12px;bottom:14px;display:grid;gap:8px}
.attrib{position:absolute;left:8px;bottom:6px;font-size:9.5px;color:var(--mut);background:color-mix(in srgb,var(--ink) 70%,transparent);padding:2px 6px;border-radius:6px}

/* ---------- misc ---------- */
.banner{display:flex;gap:9px;align-items:center;background:var(--surf2);border:1px dashed var(--line2);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--txt2)}
.empty{text-align:center;padding:34px 18px;color:var(--mut)}
.empty .em{font-size:34px;display:block;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px);transform:translate(-50%,14px);z-index:80;background:var(--txt);color:var(--ink);padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
.toast.in{opacity:1;transform:translate(-50%,0)}
.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--txt2)}
.seg button.on{background:var(--surf);color:var(--txt);box-shadow:var(--shadow)}
.fld{display:grid;gap:6px}
.fld>label{font-size:12.5px;color:var(--mut);font-weight:600}
.sw{width:50px;height:30px;border-radius:999px;background:var(--surf3);border:1px solid var(--line2);position:relative;flex:none;transition:.18s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--txt2);transition:.18s}
.sw.on{background:var(--pine);border-color:transparent}
.sw.on:after{left:23px;background:#fff}
.tlday{position:relative;padding-left:18px}
.tlday:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tlday .dot{position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line2)}
.tlday .dot.on{background:var(--gold)}
.bar{height:6px;border-radius:3px;background:var(--surf3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){
  .sheet{top:auto;bottom:var(--kb);max-width:720px;margin:0 auto;height:auto;max-height:var(--sheet-max);
    border-radius:24px 24px 0 0;border-top:1px solid var(--line2);transform:translateY(102%)}
  .sheet.in{transform:none}
  .sheet .grab{display:block;width:42px;height:4px;border-radius:2px;background:var(--line2);margin:9px auto 2px}
  .sheet .hd{padding:6px 16px 12px}
  .sheet .sc{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
  #view{padding:0 20px 30px}
  .qgrid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <main id="view"></main>
</div>
<nav class="bn" id="nav"></nav>
<div id="layers"></div>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   Roadtrip Companion — a personal road-trip copilot
   Single-file PWA. No build step. Works fully offline once cached.
   Layers:  data → store → services → views → shell
   ===================================================================== */
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc = (s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pad=n=>String(n).padStart(2,'0');
const hhmm=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60));
const mins2h=m=>m<60?`${Math.round(m)} min`:(m%60<5?`${Math.floor(m/60)}h`:`${Math.floor(m/60)}h${pad(Math.round(m%60))}`);
const todayISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
function haversine(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,
  la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}
/* Road distance ≈ crow-flies × 1.25 + 3 km of local roads. Average speed rises
   with distance: village hops crawl, long legs run on motorway. */
const driveKm =(a,b)=>Math.round(haversine(a,b)*1.25+3);
const driveMin=(a,b)=>{ const km=haversine(a,b)*1.25+3;
  return Math.max(4,Math.round(km/clamp(40+0.30*km,40,95)*60)); };

/* =====================================================================
   1. DEMO DATA  (clearly separated: every record carries source:'demo')
   ===================================================================== */
const REGIONS={
  'gironde':{name:'Bordeaux & Gironde',country:'France',flag:'🇫🇷',c:{lat:44.84,lng:-0.58}},
  'landes':{name:'Landes & Arcachon',country:'France',flag:'🇫🇷',c:{lat:44.6,lng:-1.15}},
  'basque-fr':{name:'French Basque Country',country:'France',flag:'🇫🇷',c:{lat:43.42,lng:-1.55}},
  'basque-es':{name:'Basque Country',country:'Spain',flag:'🇪🇸',c:{lat:43.31,lng:-2.0}},
  'cantabria':{name:'Cantabria',country:'Spain',flag:'🇪🇸',c:{lat:43.39,lng:-4.2}},
  'asturias':{name:'Asturias',country:'Spain',flag:'🇪🇸',c:{lat:43.4,lng:-5.5}},
  'galicia':{name:'Galicia',country:'Spain',flag:'🇪🇸',c:{lat:42.9,lng:-8.4}},
  'minho':{name:'Minho & Porto',country:'Portugal',flag:'🇵🇹',c:{lat:41.4,lng:-8.4}},
  'douro':{name:'Douro Valley',country:'Portugal',flag:'🇵🇹',c:{lat:41.2,lng:-7.6}},
  'centro-pt':{name:'Centro & Aveiro',country:'Portugal',flag:'🇵🇹',c:{lat:40.6,lng:-8.5}},
};
const CATS={
  detour:{n:'Worth a detour',e:'⭐'}, food:{n:'Food',e:'🍽️'}, nature:{n:'Nature',e:'🌿'},
  village:{n:'Villages',e:'🏘️'}, city:{n:'Cities',e:'🏛️'}, beach:{n:'Beaches',e:'🏖️'},
  hike:{n:'Hikes',e:'🥾'}, view:{n:'Viewpoints',e:'👁️'}, market:{n:'Markets',e:'🧺'},
  castle:{n:'Castles',e:'🏰'}, motorsport:{n:'Motorsport',e:'🏁'}, product:{n:'Local products',e:'🧀'},
};
const DOG={ in:{l:'Inside too',t:'good'}, out:{l:'Outdoors only',t:'warn'}, leash:{l:'On leash',t:'good'},
  no:{l:'Not allowed',t:'bad'}, unk:{l:'Unknown',t:''} };
const PARK={ easy:{l:'Easy',t:'good'}, moderate:{l:'Fiddly',t:'warn'}, hard:{l:'Painful',t:'bad'}, none:{l:'No car access',t:'bad'} };
const CROWD={1:'Quiet',2:'Moderate',3:'Busy',4:'Very touristy'};

/* P(id,name,lat,lng,cat,region,visitMin,visitMax,cost,park,dog,crowd,scenic,food,uniq,best,why,tags) */
function P(id,name,lat,lng,cat,region,vmin,vmax,cost,park,dog,crowd,scenic,food,uniq,best,why,tags,hours){
  return {id,name,coordinates:{lat,lng},category:cat,region,country:REGIONS[region].country,
    visitDuration:[vmin,vmax],costEstimate:cost,parkingDifficulty:park,dogStatus:dog,crowdLevel:crowd,
    scenic,foodValue:food,uniqueness:uniq,bestTime:best,why,tags:tags.split(' '),openingHours:hours||null,
    weatherSuitability:tags.includes('indoor')?'rain':(tags.includes('shade')?'hot':'fair'),
    photos:[],source:'demo'};
}
const PLACES=[
/* --- French Basque Country --- */
P('sjdl','Saint-Jean-de-Luz',43.3889,-1.66,'village','basque-fr',120,180,8,'moderate','out',3,3,3,2,'morning',
 'The most pleasant coastal stop between Biarritz and the border. Big sheltered bay, walkable old streets, good bakeries. Park in the Ravel car park and walk in — the centre is a nightmare in August.','outdoor food beach village free dog hot-ok','Shops 10:00–19:30, most close 13:00–15:00'),
P('espelette','Espelette',43.3417,-1.445,'village','basque-fr',60,90,5,'easy','out',3,3,2,3,'morning',
 'One street, red peppers hanging off every balcony, and half a dozen serious food shops. Forty-five minutes is genuinely enough unless you are shopping properly.','outdoor village product food hot-ok dog','Shops 10:00–18:30'),
P('ainhoa','Ainhoa',43.3069,-1.4986,'village','basque-fr',45,60,0,'easy','out',3,1,2,3,'any',
 'A single ridiculously photogenic street of red-and-white Labourdine houses. Free, quick, no queues. Best paired with Espelette — they are 12 minutes apart.','outdoor village free dog scenic-road hot-ok'),

/* =====================================================================
   2. STORE — localStorage now, written so a sync adapter can drop in later
   ===================================================================== */
const Store = (()=>{
  const KEY='rtc.v1';
  const fresh=()=>({
    version:1, updatedAt:Date.now(),
    trip:defaultTrip(),
    activeBaseId:'b3',
    manualLocation:null,         // {name,lat,lng} when geolocation is off/denied
    prefs:{
      dogMode:true, theme:'dark', likes:['scenic','food','product','village','city','view','nature','market','hike','history','festival','motorsport'],
      maxDriveMin:120, intensity:'normal', startTime:'09:30', returnTime:'19:00',
      avoidCrowds:true, currency:'EUR', units:'km', askedLocation:false
    },
    saved:[], visited:[], plans:[], parking:null, foodLog:[], notes:{}, scans:[], routes:[], userPlaces:[],
    activeDay:null, dayLog:[],
    weatherCache:null, syncQueue:[]
  });
  let s;
  try{ const raw=localStorage.getItem(KEY); s=raw?JSON.parse(raw):fresh(); }catch(e){ s=fresh(); }
  if(!s||!s.prefs) s=fresh();
  if(!s.userPlaces) s.userPlaces=[];   // migration from v1
  if(!s.dayLog) s.dayLog=[];           // migration from v2
  let t=null;
  const persist=()=>{ s.updatedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){ Shell.toast('Storage full — clear some photos'); } };
  const api={
    get s(){return s;},
    save(){ clearTimeout(t); t=setTimeout(persist,120); },   // debounced write
    reset(){ s=fresh(); persist(); location.reload(); },
    export(){ return JSON.stringify(s,null,1); },
    import(json){ s=JSON.parse(json); persist(); location.reload(); },
    /* --- saved places --- */
    isSaved:id=>s.saved.some(x=>x.placeId===id),
    toggleSave(id){
      const i=s.saved.findIndex(x=>x.placeId===id);
      if(i>=0) s.saved.splice(i,1); else s.saved.push({placeId:id,savedAt:Date.now()});
      api.save(); return i<0;
    },
    /* --- visits --- */
    visit:id=>s.visited.find(v=>v.placeId===id),
    markVisited(id,rating){
      let v=api.visit(id);
      if(!v){ v={id:uid('v'),placeId:id,date:todayISO(),rating:rating||'good',notes:'',photos:[]}; s.visited.unshift(v); }
      else if(rating) v.rating=rating;
      api.save(); return v;
    },
    unvisit(id){ s.visited=s.visited.filter(v=>v.placeId!==id); api.save(); },
    /* --- plans --- */
    savePlan(p){ s.plans=s.plans.filter(x=>x.id!==p.id); s.plans.unshift(p); s.plans=s.plans.slice(0,24); api.save(); },
    /* --- food --- */
    boughtFood(fid){ if(!s.foodLog.some(f=>f.foodId===fid)) s.foodLog.unshift({foodId:fid,date:todayISO(),place:api.base()?.name||''}); api.save(); },
    /* --- base / location --- */
    base(){ return s.trip.bases.find(b=>b.id===s.activeBaseId)||s.trip.bases[0]; },
    nextBase(){ const i=s.trip.bases.findIndex(b=>b.id===s.activeBaseId); return s.trip.bases[i+1]||null; },
    here(){
      if(Geo.live) return {name:Geo.live.name||'Current position',...Geo.live};
      if(s.manualLocation) return s.manualLocation;
      const b=api.base(); return {name:b.name,lat:b.coordinates.lat,lng:b.coordinates.lng};
    },
    region(){
      const h=api.here();
      let best=null,bd=1e9;
      for(const [k,r] of Object.entries(REGIONS)){ const d=haversine(h,r.c); if(d<bd){bd=d;best=k;} }
      return best;
    }
  };
  return api;
})();

/* ---- Geolocation: optional, never blocking ---- */
const Geo = {
  live:null, status:'idle', // idle | asking | ok | denied | unavailable
  ask(){
    if(!navigator.geolocation){ Geo.status='unavailable'; return Promise.resolve(null); }
    Geo.status='asking'; Views.render();
    return new Promise(res=>{
      navigator.geolocation.getCurrentPosition(
        p=>{ Geo.live={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,at:Date.now()};
             Geo.status='ok'; Store.s.prefs.askedLocation=true; Store.save(); Weather.refresh(); Views.render();
             /* name the spot so the header reads "Getaria", not "Current position" */
             Geocode.reverse(Geo.live.lat,Geo.live.lng).then(r=>{ if(r&&Geo.live){ Geo.live.name=r.name; Views.render(); } });
             res(Geo.live); },
        e=>{ Geo.status=e.code===1?'denied':'unavailable'; Store.s.prefs.askedLocation=true; Store.save(); Views.render(); res(null); },
        {enableHighAccuracy:false,timeout:8000,maximumAge:300000});
    });
  }
};

/* ---- Weather: Open-Meteo, cached, with an honest offline fallback ---- */
const Weather = (()=>{
  const CODES={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
    45:['Fog','🌫️'],48:['Freezing fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],
    61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Snow','🌨️'],80:['Showers','🌦️'],
    81:['Showers','🌧️'],82:['Heavy showers','⛈️'],95:['Thunderstorms','⛈️'],96:['Thunderstorms','⛈️'],99:['Thunderstorms','⛈️']};
  let cur=null, loading=false;
  function mock(loc){
    // Deterministic seasonal stand-in so the app is never blank offline.
    const m=new Date().getMonth(), h=new Date().getHours();
    const base=[11,12,14,16,19,23,26,26,23,19,14,11][m] + (loc.lat<42?2:0);
    const temp=Math.round(base + Math.sin((h-4)/24*Math.PI*2)*4);
    const code=(m>=5&&m<=8)?(loc.lng<-7?1:0):(loc.lng<-7?61:2);
    return {temp,feels:temp-1,code,rain:code>=51?55:(code>=1?15:5),wind:16,
      hourly:Array.from({length:12},(_,i)=>({h:(h+i)%24,t:Math.round(temp+Math.sin((h+i-4)/24*Math.PI*2)*4-2),r:code>=51?50:8})),
      daily:Array.from({length:5},(_,i)=>({d:i,hi:base+3-i%2,lo:base-6,code:i%3===0?61:1})),
      at:Date.now(),stale:true,source:'offline estimate'};
  }
  async function fetchLive(loc){
    const u=`${Config.weather.base}?latitude=${loc.lat.toFixed(3)}&longitude=${loc.lng.toFixed(3)}`+
      `&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m`+
      `&hourly=temperature_2m,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`+
      `&forecast_days=5&timezone=auto`;
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error('weather '+r.status);
    const j=await r.json(), hIdx=new Date().getHours();
    return {
      temp:Math.round(j.current.temperature_2m), feels:Math.round(j.current.apparent_temperature),
      code:j.current.weather_code, rain:j.hourly.precipitation_probability?.[hIdx]??0,
      wind:Math.round(j.current.wind_speed_10m),
      hourly:j.hourly.time.slice(hIdx,hIdx+12).map((t,i)=>({h:new Date(t).getHours(),
        t:Math.round(j.hourly.temperature_2m[hIdx+i]),r:j.hourly.precipitation_probability[hIdx+i]})),
      daily:j.daily.time.map((t,i)=>({d:i,hi:Math.round(j.daily.temperature_2m_max[i]),
        lo:Math.round(j.daily.temperature_2m_min[i]),code:j.daily.weather_code[i],r:j.daily.precipitation_probability_max[i]})),
      at:Date.now(),stale:false,source:'Open-Meteo'
    };
  }
  return {
    get now(){ return cur; }, get loading(){ return loading; },
    desc:c=>(CODES[c]||['Cloudy','☁️'])[0], icon:c=>(CODES[c]||['Cloudy','☁️'])[1],
    /* one of: rain | hot | fair — drives recommendations */
    mood(){ const w=cur; if(!w) return 'fair';
      if(w.rain>=55||[55,63,65,80,81,82,95,96,99].includes(w.code)) return 'rain';
      if(w.temp>=29) return 'hot'; return 'fair'; },
    async refresh(force){
      const loc=Store.here(); const c=Store.s.weatherCache;
      if(!force && c && Date.now()-c.at<45*60e3 && haversine(c.loc,loc)<25){ cur=c.data; return cur; }
      loading=true; Views.render();
      try{
        cur=await fetchLive(loc);
        Store.s.weatherCache={loc,data:cur,at:Date.now()}; Store.save();
      }catch(e){
        if(c){ cur={...c.data,stale:true,source:'cached '+new Date(c.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}; }
        else cur=mock(loc);
      }
      loading=false; Views.render(); return cur;
    }
  };
})();

/* ---- Geocoding: Nominatim, throttled and cached, with an offline fallback ---- */
const Geocode=(()=>{
  const KEY='rtc.geocache';
  let cache={}; try{ cache=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
  const put=(k,v)=>{ cache[k]={v,at:Date.now()};
    const ks=Object.keys(cache); if(ks.length>400) delete cache[ks[0]];
    try{ localStorage.setItem(KEY,JSON.stringify(cache)); }catch(e){} };
  /* Nominatim asks for no more than one request a second. Respect it. */
  let last=0;
  const throttle=async()=>{ const w=1100-(Date.now()-last); if(w>0) await new Promise(r=>setTimeout(r,w)); last=Date.now(); };
  const VIEWBOX='-10.6,36.0,4.2,47.6';   // Iberia and southern France, as a bias not a limit
  function parseCoords(q){
    const m=String(q).trim().match(/^(-?\d{1,2}(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:[.,]\d+)?)$/);
    if(!m) return null;
    const lat=parseFloat(m[1].replace(',','.')), lng=parseFloat(m[2].replace(',','.'));
    if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return null;
    return {name:`${lat.toFixed(4)}, ${lng.toFixed(4)}`,detail:'Pasted coordinates',lat,lng,kind:'coordinates',source:'coordinates'};
  }
  function offline(q){
    const t=q.toLowerCase().trim(); if(!t) return [];
    const inPlaces=allPlaces().filter(p=>p.name.toLowerCase().includes(t))
      .map(p=>({name:p.name,detail:REGIONS[p.region].name,lat:p.coordinates.lat,lng:p.coordinates.lng,
        kind:CATS[p.category].n,placeId:p.id,source:'offline'}));
    const inBases=Store.s.trip.bases.filter(b=>b.name.toLowerCase().includes(t))
      .map(b=>({name:b.name,detail:'Your base · '+b.arrival,lat:b.coordinates.lat,lng:b.coordinates.lng,
        kind:'Base',baseId:b.id,source:'offline'}));
    const inRegions=Object.values(REGIONS).filter(r=>r.name.toLowerCase().includes(t)||r.country.toLowerCase().includes(t))
      .map(r=>({name:r.name,detail:r.country,lat:r.c.lat,lng:r.c.lng,kind:'Region',source:'offline'}));
    return [...inPlaces,...inBases,...inRegions].slice(0,8);
  }
  return {
    parseCoords, offline,
    get cached(){ return Object.keys(cache).length; },
    async search(q){
      const c=parseCoords(q); if(c) return [c];
      const k='s:'+q.toLowerCase().trim();
      if(cache[k]) return cache[k].v.map(r=>({...r,cached:true}));
      const local=offline(q);
      if(!navigator.onLine) return local;
      try{
        await throttle();
        const u=`${Config.search.base}?format=jsonv2&limit=8&addressdetails=1&accept-language=en`+
          `&viewbox=${VIEWBOX}&q=${encodeURIComponent(q)}`;
        const r=await fetch(u,{headers:{Accept:'application/json'}});
        if(!r.ok) throw new Error('geocode '+r.status);
        const j=await r.json();
        const out=j.map(x=>({
          name:(x.name||String(x.display_name).split(',')[0]).trim(),
          detail:String(x.display_name).split(',').slice(1,4).join(',').trim(),
          lat:+x.lat, lng:+x.lon, kind:String(x.type||x.category||'place').replace(/_/g,' '),
          osm:x.osm_type+'/'+x.osm_id, source:'nominatim'}));
        if(out.length) put(k,out);
        return out.length?out:local;
      }catch(e){ return local; }
    },
    async reverse(lat,lng){
      const k=`r:${lat.toFixed(3)},${lng.toFixed(3)}`;
      if(cache[k]) return cache[k].v;
      if(!navigator.onLine) return null;
      try{
        await throttle();
        const u=`${Config.search.reverse}?format=jsonv2&zoom=14&accept-language=en&lat=${lat}&lon=${lng}`;
        const r=await fetch(u,{headers:{Accept:'application/json'}});
        if(!r.ok) throw new Error('reverse');
        const j=await r.json(), a=j.address||{};
        const name=a.village||a.town||a.city||a.suburb||a.municipality||a.county||j.name;
        if(!name) return null;
        const out={name,detail:[a.county,a.state,a.country].filter(Boolean).join(', ')};
        put(k,out); return out;
      }catch(e){ return null; }
    }
  };
})();

/* ---- Places you add yourself, with real coordinates ---- */
const Places=(()=>{
  const SEED={
    food:{scenic:1,foodValue:3,uniqueness:1,visit:[60,90],cost:22,park:'moderate',dog:'out',tags:'outdoor food'},
    nature:{scenic:3,foodValue:0,uniqueness:2,visit:[90,150],cost:0,park:'moderate',dog:'leash',tags:'outdoor nature free'},
    village:{scenic:3,foodValue:2,uniqueness:2,visit:[60,120],cost:8,park:'easy',dog:'out',tags:'outdoor village'},
    city:{scenic:2,foodValue:3,uniqueness:2,visit:[150,240],cost:20,park:'hard',dog:'out',tags:'outdoor city food'},
    beach:{scenic:3,foodValue:1,uniqueness:1,visit:[90,180],cost:0,park:'moderate',dog:'leash',tags:'outdoor beach free hot-ok'},
    hike:{scenic:3,foodValue:0,uniqueness:2,visit:[120,240],cost:0,park:'moderate',dog:'leash',tags:'outdoor nature hike free shade'},
    view:{scenic:3,foodValue:0,uniqueness:2,visit:[30,60],cost:0,park:'easy',dog:'leash',tags:'outdoor view free'},
    market:{scenic:1,foodValue:3,uniqueness:2,visit:[45,90],cost:15,park:'moderate',dog:'out',tags:'market food product rain-ok'},
    castle:{scenic:2,foodValue:0,uniqueness:2,visit:[75,120],cost:10,park:'easy',dog:'out',tags:'outdoor castle history'},
    motorsport:{scenic:1,foodValue:1,uniqueness:3,visit:[90,180],cost:12,park:'easy',dog:'leash',tags:'motorsport'},
    product:{scenic:1,foodValue:3,uniqueness:2,visit:[30,60],cost:15,park:'easy',dog:'out',tags:'product food indoor rain-ok'},
    detour:{scenic:3,foodValue:1,uniqueness:3,visit:[60,120],cost:5,park:'moderate',dog:'leash',tags:'outdoor'},
  },
  nearestRegion=ll=>{ let k=null,d=1e9;
    for(const [key,r] of Object.entries(REGIONS)){ const x=haversine(ll,r.c); if(x<d){d=x;k=key;} } return k; };
  return {
    seed:c=>SEED[c]||SEED.detour,
    nearestRegion,
    /* d: {name, lat, lng, category, visit, cost, park, dog, why, hours, detail} */
    create(d){
      const cat=d.category||'detour', seed=SEED[cat]||SEED.detour;
      const region=d.region||nearestRegion({lat:d.lat,lng:d.lng});
      const tags=new Set(seed.tags.split(' '));
      const cost=d.cost==null?seed.cost:+d.cost;
      if(cost===0) tags.add('free');
      if(['in','leash','out'].includes(d.dog||seed.dog)) tags.add('dog');
      if(!tags.has('indoor')) tags.add('outdoor');
      const p={
        id:uid('up'), name:(d.name||'Unnamed place').trim(),
        coordinates:{lat:+(+d.lat).toFixed(6),lng:+(+d.lng).toFixed(6)},
        category:cat, region, country:REGIONS[region].country,
        visitDuration:d.visit||seed.visit, costEstimate:cost,
        parkingDifficulty:d.park||seed.park, dogStatus:d.dog||seed.dog,
        crowdLevel:d.crowd||2, scenic:seed.scenic, foodValue:seed.foodValue, uniqueness:seed.uniqueness,
        bestTime:d.bestTime||'any', why:(d.why||'').trim()||'Your own find. Add a note next time you are here.',
        tags:[...tags], openingHours:d.hours||null,
        weatherSuitability:tags.has('indoor')?'rain':(tags.has('shade')?'hot':'fair'),
        photos:[], address:d.detail||null, source:'user', addedAt:Date.now()
      };
      Store.s.userPlaces.unshift(p);
      if(!Store.isSaved(p.id)) Store.toggleSave(p.id); else Store.save();
      return p;
    },
    update(id,patch){
      const p=Store.s.userPlaces.find(x=>x.id===id); if(!p) return null;
      Object.assign(p,patch);
      if(patch.category){ const sd=SEED[patch.category]||SEED.detour;
        Object.assign(p,{scenic:sd.scenic,foodValue:sd.foodValue,uniqueness:sd.uniqueness});
        p.tags=[...new Set([...sd.tags.split(' '),...(p.costEstimate===0?['free']:[])])]; }
      p.weatherSuitability=p.tags.includes('indoor')?'rain':(p.tags.includes('shade')?'hot':'fair');
      Store.save(); return p;
    },
    remove(id){
      Store.s.userPlaces=Store.s.userPlaces.filter(p=>p.id!==id);
      Store.s.saved=Store.s.saved.filter(x=>x.placeId!==id);
      Store.s.visited=Store.s.visited.filter(x=>x.placeId!==id);
      Store.s.plans.forEach(pl=>{ pl.stops=pl.stops.filter(st=>st.placeId!==id); });
      delete Store.s.notes[id]; Store.save();
    }
  };
})();

/* ---- "Worth it?" engine — human advice, deliberately no single score ---- */
const WorthIt = {
  eval(place, from){
    const here=from||Store.here();
    const km=driveKm(here,place.coordinates), min=driveMin(here,place.coordinates);
    const p=place, dogOK=['in','leash','out'].includes(p.dogStatus);
    const vis=p.visitDuration, visTxt=vis[0]>=120?`${(vis[0]/60).toFixed(0)}–${(vis[1]/60).toFixed(0)} hours`:`${vis[0]}–${vis[1]} min`;
    /* ratio of time spent there vs time spent getting there */
    const ratio=(vis[0]+vis[1])/2 / Math.max(12,min*2);
    const quality=p.scenic+p.uniqueness+p.foodValue;   // 0..12
    const kind = min<=12 ? 'doorstep'
      : (ratio>=1.1 && quality>=6) ? 'worth'
      : ratio>=0.7 ? 'ifnearby'
      : quality>=8 ? 'theday'
      : min>90 ? 'toofar' : 'onroute';
    const verdict={
      doorstep:`Right on your doorstep — go whenever you feel like it.`,
      worth:`Worth a ${min<45?mins2h(min):Math.round(min/10)*10+' min'} detour on its own.`,
      ifnearby:`Worth stopping if you are already heading that way.`,
      theday:`Special enough to justify the ${mins2h(min)} each way — but make it the day, not a stop.`,
      toofar:`Nice, but probably not worth ${mins2h(min)} of driving for ${visTxt}.`,
      onroute:`Fine if it is already on your route. Not a reason to make a special trip.`
    }[kind];
    /* pairing advice */
    const near=allPlaces().filter(o=>o.id!==p.id && driveMin(p.coordinates,o.coordinates)<=22)
      .sort((a,b)=>(b.scenic+b.uniqueness+b.foodValue)-(a.scenic+a.uniqueness+a.foodValue));
    const pair=near[0]?`Best combined with ${near[0].name}${near[1]?' or '+near[1].name:''}.`:'';
    const flags=[];
    if(Store.s.prefs.dogMode && !dogOK) flags.push('Dogs are not allowed here — plan this for a day without the dog.');
    if(p.parkingDifficulty==='hard') flags.push('Parking is the hard part. Use an edge-of-town car park and walk.');
    if(p.crowdLevel>=4&&Store.s.prefs.avoidCrowds) flags.push('Very touristy in the middle of the day. Go early or late.');
    const w=Weather.now, mood=Weather.mood();
    if(w){
      if(mood==='rain'&&p.weatherSuitability!=='rain'&&p.tags.includes('outdoor')) flags.push(`Rain likely (${w.rain}%) — this one is better on a dry day.`);
      if(mood==='hot'&&!p.tags.includes('hot-ok')&&!p.tags.includes('shade')&&p.tags.includes('outdoor')) flags.push('Little shade and hot today. Go before 11:00 or after 18:00 — watch the pavement for paws.');
      if(mood==='rain'&&p.weatherSuitability==='rain') flags.push('Good rain plan: mostly indoors.');
    }
    return {km,min,visTxt,verdict,pair,flags,dogOK,
      cost:p.costEstimate===0?'Free':`≈ €${p.costEstimate} each`,
      detourLabel:{doorstep:'On the way',worth:'Worth it',ifnearby:'If nearby',
        theday:'Make it the day',toofar:'Marginal',onroute:'If on the route'}[kind]};
  }
};

/* ---- Day planner ---- */
const Planner = {
  themes:{
    relaxed:{label:'Relaxed',tag:'Option A',w:{food:2,village:2,view:1,beach:2,city:0,hike:-2,nature:1,market:1,castle:0,motorsport:0,product:1,detour:1},maxDrive:55,stops:3,pace:1.25},
    explore:{label:'Explore',tag:'Option B',w:{food:2,village:2,city:2,market:2,castle:1,view:1,nature:1,product:2,hike:0,beach:1,motorsport:1,detour:2},maxDrive:90,stops:4,pace:1.0},
    adventure:{label:'Adventure',tag:'Option C',w:{hike:3,nature:3,view:2,beach:1,village:1,food:1,city:-1,market:0,castle:1,motorsport:2,product:0,detour:2},maxDrive:150,stops:4,pace:.9},
  },
  score(p,theme,opts){
    const here=opts.from, min=driveMin(here,p.coordinates);
    if(min>opts.maxDriveMin) return -1;
    let s=(theme.w[p.category]??0)*3 + p.scenic + p.uniqueness + p.foodValue*0.8;
    s -= min/18;                                             // driving is a cost
    if(Store.s.prefs.likes.some(l=>p.tags.includes(l))) s+=1.5;
    if(opts.prefs?.length) s += opts.prefs.some(t=>p.tags.includes(t)||p.category===t)?5:-1.5;
    if(opts.dog && !['in','leash','out'].includes(p.dogStatus)) s-=9;
    if(opts.dog && (p.tags.includes('dog'))) s+=2;
    if(Store.s.prefs.avoidCrowds) s-=(p.crowdLevel-2)*0.8;
    if(Store.visit(p.id)) s-=6;                              // been there already
    if(Store.isSaved(p.id)) s+=2.5;
    const mood=opts.mood;
    if(mood==='rain') s += p.weatherSuitability==='rain'?5:(p.tags.includes('outdoor')?-4:0);
    if(mood==='hot')  s += (p.tags.includes('shade')||p.tags.includes('hot-ok')||p.category==='beach')?3:-2.5;
    if(opts.exclude?.includes(p.id)) return -1;
    return s;
  },
  /* Builds a realistic day: drive + visit + lunch, in geographic order */
  build(themeKey,opts={}){
    const th=this.themes[themeKey]||this.themes.explore;
    const o={from:Store.here(),dog:Store.s.prefs.dogMode,mood:Weather.mood(),
      start:Store.s.prefs.startTime,end:Store.s.prefs.returnTime,
      maxDriveMin:Math.min(Store.s.prefs.maxDriveMin,Math.round(th.maxDrive*(Weather.mood()==='rain'?1.4:1))),prefs:[],exclude:[],
      intensity:Store.s.prefs.intensity,...opts};
    const pace={relaxed:1.3,normal:1,busy:.82}[o.intensity]||1;
    const want=clamp(th.stops+(o.intensity==='busy'?1:o.intensity==='relaxed'?-1:0),2,6);
    const pool=allPlaces().map(p=>({p,s:this.score(p,th,o)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    if(!pool.length) return null;
    /* pick a spread: best first, then nearest-good to keep driving sane */
    const chosen=[pool[0].p];
    while(chosen.length<want){
      let best=null,bs=-1e9;
      for(const {p,s} of pool.slice(0,26)){
        if(chosen.includes(p)) continue;
        const hop=Math.min(...chosen.map(c=>driveMin(c.coordinates,p.coordinates)));
        const v=s-hop/9 - (chosen.some(c=>c.category===p.category)?1.5:0);
        if(v>bs){bs=v;best=p;}
      }
      if(!best) break; chosen.push(best);
    }
    /* order them as a loop from home */
    const route=[]; let cur=o.from, rest=[...chosen];
    while(rest.length){ rest.sort((a,b)=>driveMin(cur,a.coordinates)-driveMin(cur,b.coordinates));
      const n=rest.shift(); route.push(n); cur=n.coordinates; }
    /* schedule */
    const [sh,sm]=o.start.split(':').map(Number); let t=sh*60+sm;
    const endT=(()=>{const [a,b]=o.end.split(':').map(Number);return a*60+b;})();
    const stops=[]; let drive=0, walk=0, cost=0, lunchDone=false; cur=o.from;
    for(const p of route){
      const dm=driveMin(cur,p.coordinates); drive+=dm; t+=dm;
      if(!lunchDone && t>=12*60+30 && !p.tags.includes('food')){
        stops.push({time:hhmm(t),name:'Lunch stop',detail:'Wherever looks good — allow an hour',kind:'lunch',dur:60});
        t+=60; lunchDone=true;
      }
      const dur=clamp(Math.round((p.visitDuration[0]*0.7+p.visitDuration[1]*0.3)*pace/5)*5,25,165);
      if(t+dur>endT-Math.round(driveMin(p.coordinates,o.from))) break;
      stops.push({time:hhmm(t),name:p.name,detail:`${CATS[p.category].n} · ${mins2h(dur)}`,placeId:p.id,kind:'place',dur,
        dog:p.dogStatus,drive:dm});
      if(p.tags.includes('food')) lunchDone=true;
      walk += p.category==='hike'?5:(p.category==='city'?3:1.6);
      cost += p.costEstimate;
      t+=dur; cur=p.coordinates;
    }
    const back=driveMin(cur,o.from); drive+=back; t+=back;
    stops.push({time:hhmm(t),name:'Back at '+(o.from.name||Store.base()?.name||'base'),detail:mins2h(back)+' drive',kind:'end'});
    const placeStops=stops.filter(s=>s.kind==='place');
    const dogWorst=placeStops.reduce((a,s)=>{const r={in:4,leash:4,out:3,unk:2,no:0}[s.dog]??2;return Math.min(a,r);},4);
    const mood=o.mood;
    const suit = placeStops.every(s=>{const p=getPlace(s.placeId);
      return mood==='rain'?p.weatherSuitability==='rain'||!p.tags.includes('outdoor'):true;});
    return {
      id:uid('plan'), theme:themeKey, tag:th.tag, date:o.date||todayISO(),
      title:this.title(themeKey,placeStops),
      stops, driveMin:drive, durationMin:t-(sh*60+sm), walkKm:Math.round(walk*10)/10,
      cost:Math.round(cost+ (lunchDone?22:0)),
      dogRating:['Not suitable','Poor','Okay','Good','Excellent'][dogWorst],
      weatherFit: mood==='rain'?(suit?'Good rain plan':'Some outdoor time — take a jacket'):mood==='hot'?'Heat-aware timing':'Suits today\u2019s weather',
      generatedAt:Date.now(), opts:{dog:o.dog,maxDriveMin:o.maxDriveMin,intensity:o.intensity,prefs:o.prefs}
    };
  },
  title(key,stops){
    const n=stops.map(s=>getPlace(s.placeId)).filter(Boolean);
    if(!n.length) return 'A day out';
    const flavour={food:'food',village:'villages',nature:'nature',beach:'coast',city:'old towns',
      hike:'hills',view:'viewpoints',market:'markets',castle:'history',motorsport:'engines',product:'produce',detour:'detours'};
    const cats=[...new Set(n.map(p=>p.category))].slice(0,2).map(c=>flavour[c]||c);
    const hero=(n.slice(1).sort((a,b)=>(b.uniqueness+b.scenic)-(a.uniqueness+a.scenic))[0]||n[0]).name.split(/[—,(]/)[0].trim();
    const head=cats.join(' & ').replace(/^./,c=>c.toUpperCase());
    return n.length>1?`${head} via ${hero}`:head;
  },
  /* swap a single stop for the next best alternative */
  replaceStop(plan,idx){
    const st=plan.stops[idx]; if(st.kind!=='place') return plan;
    const ex=plan.stops.filter(s=>s.placeId).map(s=>s.placeId);
    const np=this.build(plan.theme,{...plan.opts,exclude:ex,date:plan.date});
    if(!np) return plan;
    const cand=np.stops.find(s=>s.kind==='place'&&!ex.includes(s.placeId));
    if(!cand) return plan;
    plan.stops[idx]={...cand,time:st.time};
    return this.reschedule(plan);
  },
  reschedule(plan){
    let t=(()=>{const [a,b]=plan.stops[0].time.split(':').map(Number);return a*60+b;})();
    let cur=Store.here(), drive=0;
    for(const s of plan.stops){
      if(s.kind==='end'){ const d=driveMin(cur,Store.here()); drive+=d; t+=d; s.time=hhmm(t); s.detail=mins2h(d)+' drive'; continue; }
      const p=s.placeId?getPlace(s.placeId):null;
      if(p){ const d=driveMin(cur,p.coordinates); drive+=d; t+=d; cur=p.coordinates; }
      s.time=hhmm(t); t+=s.dur||45;
    }
    plan.driveMin=drive; return plan;
  },
  /* nudges from the Home buttons */
  nudge(plan,kind){
    const o={...plan.opts,date:plan.date};
    if(kind==='less-driving') o.maxDriveMin=Math.max(25,Math.round((o.maxDriveMin||90)*0.55));
    if(kind==='food') o.prefs=['food','market','product'];
    if(kind==='nature') o.prefs=['nature','hike','view'];
    if(kind==='towns') o.prefs=['village','city'];
    if(kind==='relax'){ o.intensity='relaxed'; o.maxDriveMin=45; }
    return this.build(kind==='relax'?'relaxed':plan.theme,o)||plan;
  }
};

/* ---- Today: tracks the day you started, and re-times what is left ----
   A plan stops being a suggestion the moment you leave. From then on the
   question is "what next, and are we still going to make it back?" */
const Today=(()=>{
  const st=()=>Store.s.activeDay;
  function plan(){
    const a=st(); if(!a) return null;
    const p=Store.s.plans.find(x=>x.id===a.planId);
    if(!p){ Store.s.activeDay=null; Store.save(); return null; }
    return p;
  }
  const nowMin=()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };
  const toMin=hm=>{ const [a,b]=String(hm||'0:00').split(':').map(Number); return a*60+b; };

  /* Re-time everything still to come, from this minute and this position. */
  function retime(){
    const a=st(), p=plan(); if(!p) return null;
    a.idx=clamp(a.idx,0,p.stops.length-1);
    let t=nowMin();
    let cur = Geo.live ? {lat:Geo.live.lat,lng:Geo.live.lng} : lastPosition(p,a);
    const home=Store.here();
    for(let i=a.idx;i<p.stops.length;i++){
      const s=p.stops[i], pl=s.placeId?getPlace(s.placeId):null;
      if(s.kind==='end'){ const d=driveMin(cur,home); s.legMin=d; t+=d; s.eta=hhmm(t); break; }
      if(pl){
        const d=(i===a.idx&&a.at)?0:driveMin(cur,pl.coordinates);
        s.legMin=d; t+=d; s.eta=hhmm(t); cur=pl.coordinates;
      } else { s.legMin=0; s.eta=hhmm(t); }
      t+=(i===a.idx&&a.at)?Math.max(5,(s.dur||45)-elapsedHere()):(s.dur||45);
    }
    Store.save(); return p;
  }
  function elapsedHere(){ const a=st(); return a&&a.arrivedAt?Math.min(240,Math.round((Date.now()-a.arrivedAt)/60000)):0; }
  function lastPosition(p,a){
    for(let i=a.idx-1;i>=0;i--){ const pl=p.stops[i].placeId?getPlace(p.stops[i].placeId):null;
      if(pl&&a.state[i]==='done') return pl.coordinates; }
    return Store.here();
  }
  return {
    get active(){ const p=plan(); return p?{a:st(),plan:p}:null; },
    isToday(){ const a=st(); return !!a&&a.date===todayISO(); },
    isFuture(){ const a=st(); return !!a&&a.date>todayISO(); },
    retime, elapsedHere,
    start(p){
      Store.s.activeDay={planId:p.id,date:p.date||todayISO(),startedAt:Date.now(),idx:0,at:false,state:{},arrivedAt:null};
      p.started=true; Store.savePlan(p); retime(); return Store.s.activeDay;
    },
    stop(){ const p=plan(); const a=st(); return p?p.stops[clamp(a.idx,0,p.stops.length-1)]:null; },
    arrive(){ const a=st(); if(!a) return; a.at=true; a.arrivedAt=Date.now(); retime(); },
    done(){
      const a=st(), p=plan(); if(!p) return;
      const s=p.stops[a.idx];
      a.state[a.idx]='done';
      if(s&&s.placeId) Store.markVisited(s.placeId,'good');
      a.idx=clamp(a.idx+1,0,p.stops.length-1); a.at=false; a.arrivedAt=null;
      retime();
      return s;
    },
    skip(){ const a=st(), p=plan(); if(!p) return;
      a.state[a.idx]='skipped'; a.idx=clamp(a.idx+1,0,p.stops.length-1); a.at=false; a.arrivedAt=null; retime(); },
    linger(m){ const a=st(), p=plan(); if(!p) return; const s=p.stops[a.idx];
      if(s) s.dur=(s.dur||45)+m; retime(); },
    dropLast(){ const p=plan(), a=st(); if(!p) return;
      for(let i=p.stops.length-1;i>a.idx;i--){ if(p.stops[i].placeId){ p.stops.splice(i,1); break; } }
      retime(); },
    /* how the day is running against the plan you set out with */
    status(){
      const p=retime(), a=st(); if(!p) return null;
      const end=p.stops[p.stops.length-1];
      const etaMin=toMin(end.eta||end.time), plannedMin=toMin(Store.s.prefs.returnTime);
      const diff=etaMin-plannedMin;
      const placeStops=p.stops.filter(s=>s.placeId);
      const done=Object.entries(a.state).filter(([i,v])=>v==='done'&&p.stops[i]&&p.stops[i].placeId).length;
      const skipped=Object.values(a.state).filter(v=>v==='skipped').length;
      return {etaHome:end.eta||end.time, diff, done, skipped, total:placeStops.length,
        late:diff>20, early:diff<-45,
        remaining:p.stops.slice(a.idx+1).filter(s=>s.placeId)};
    },
    finish(){
      const p=plan(), a=st(); if(!p){ Store.s.activeDay=null; Store.save(); return null; }
      const stt=this.status();
      const entry={id:uid('day'),date:a.date,planId:p.id,title:p.title,
        done:stt.done,skipped:stt.skipped,driveMin:p.driveMin,
        places:Object.entries(a.state).filter(([i,v])=>v==='done').map(([i])=>p.stops[i]&&p.stops[i].placeId).filter(Boolean),
        startedAt:a.startedAt,endedAt:Date.now()};
      Store.s.dayLog.unshift(entry); Store.s.dayLog=Store.s.dayLog.slice(0,60);
      Store.s.activeDay=null; Store.save(); return entry;
    },
    cancel(){ Store.s.activeDay=null; Store.save(); }
  };
})();

/* ---- AI abstraction: local rule engine now, provider slot for later ---- */
const AI = {
  get provider(){ return Config.keyFor('ai')?Config.ai.provider:'local'; },
  context(){
    const h=Store.here(), w=Weather.now, b=Store.base();
    return {location:h.name,coords:[h.lat.toFixed(3),h.lng.toFixed(3)],time:new Date().toTimeString().slice(0,5),
      weather:w?`${w.temp}°C, ${Weather.desc(w.code)}, rain ${w.rain}%`:'unknown',
      base:b?.name,nextBase:Store.nextBase()?.name,dogMode:Store.s.prefs.dogMode,
      visited:Store.s.visited.map(v=>getPlace(v.placeId)?.name).filter(Boolean),
      saved:Store.s.saved.map(v=>getPlace(v.placeId)?.name).filter(Boolean),
      likes:Store.s.prefs.likes,maxDriveMin:Store.s.prefs.maxDriveMin};
  },
  async ask(q){
    if(this.provider!=='local'){ try{ return await this.remote(q); }catch(e){ /* fall through */ } }
    return this.local(q);
  },
  async remote(q){
    const r=await fetch(Config.ai.base,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({model:Config.ai.model,context:this.context(),question:q})});
    if(!r.ok) throw new Error('ai'); const j=await r.json(); return j.answer;
  },
  local(q){
    const t=q.toLowerCase(), mood=Weather.mood(), dog=Store.s.prefs.dogMode;
    const pick=(prefs,max)=>Planner.build('explore',{prefs,maxDriveMin:max||Store.s.prefs.maxDriveMin});
    let intent='day';
    if(/eat|food|lunch|dinner|hungry|pintxo/.test(t)) intent='food';
    else if(/view|sunset|photo/.test(t)) intent='view';
    else if(/dog|paws/.test(t)) intent='dog';
    else if(/event|festival|market|today.*on/.test(t)) intent='event';
    else if(/park|car/.test(t)) intent='parking';
    else if(/rain|wet|weather/.test(t)) intent='weather';
    const lines=[];
    if(intent==='parking'){
      const pk=Store.s.parking;
      lines.push(pk?`Your car is at ${pk.note||'the saved spot'}, parked ${new Date(pk.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}${pk.expires?`, paid until ${pk.expires}`:''}. It is ${Math.round(haversine(Store.here(),pk.coordinates)*1000)} m away.`:`No parking saved. Tap “Where did we park?” when you next leave the car.`);
    } else if(intent==='event'){
      const evs=Events.near(50,'week');
      lines.push(evs.length?`${evs.length} things on within 50 km this week. Closest today: ${evs[0].name} — ${evs[0].why}`:'Nothing in the radar within 50 km this week.');
    } else if(intent==='weather'){
      const w=Weather.now;
      lines.push(w?`${w.temp}°C, ${Weather.desc(w.code).toLowerCase()}, ${w.rain}% chance of rain, wind ${w.wind} km/h.`:'No weather data yet.');
      lines.push(mood==='rain'?'Rain plan: market halls, old towns with arcades, a museum, and a long lunch.':mood==='hot'?'Heat plan: coast or shaded valleys in the morning, a village and a terrace after 18:00.':'Good conditions — spend it outdoors.');
    } else {
      const prefs={food:['food','market','product'],view:['view'],dog:['dog'],day:[]}[intent];
      const plan=pick(prefs);
      if(plan){
        lines.push(`${plan.title}. ${plan.stops.filter(s=>s.kind==='place').length} stops, ${mins2h(plan.driveMin)} driving, dog ${plan.dogRating.toLowerCase()}.`);
        plan.stops.filter(s=>s.kind==='place').forEach(s=>{
          const p=getPlace(s.placeId); lines.push(`${s.time} · ${p.name} — ${p.why.split('.')[0]}.`);
        });
        Store.savePlan(plan);
      } else lines.push('Nothing matches those constraints. Try raising the maximum driving time.');
    }
    if(dog&&intent!=='parking') lines.push('Dog Mode is on, so anything that bans dogs has been left out.');
    return lines.join('\n');
  }
};

/* ---- Events radar ---- */
const Events = {
  near(radiusKm,when){
    const h=Store.here(), t=todayISO(), d1=(()=>{const d=new Date();d.setDate(d.getDate()+1);return todayISO(d);})();
    const wk=(()=>{const d=new Date();d.setDate(d.getDate()+7);return todayISO(d);})();
    return EVENTS.map(e=>({...e,km:driveKm(h,e.coordinates),min:driveMin(h,e.coordinates)}))
      .filter(e=>e.km<=radiusKm)
      .filter(e=>when==='today'?e.date===t:when==='tomorrow'?e.date===d1:(e.date>=t&&e.date<=wk))
      .filter(e=>!Store.s.prefs.dogMode||e.dogFriendly||when!=='today')
      .sort((a,b)=>a.date===b.date?a.km-b.km:a.date<b.date?-1:1);
  },
  kindEmoji:k=>({festival:'🎉',food:'🍽️',market:'🧺',concert:'🎶',motorsport:'🏁',culture:'🖼️'}[k]||'📍')
};

/* ---- Filters ---- */
const FILTERS=[
  {id:'dog',label:'🐕 Dog friendly',fn:p=>['in','leash','out'].includes(p.dogStatus)},
  {id:'free',label:'Free',fn:p=>p.costEstimate===0},
  {id:'u20',label:'Under €20',fn:p=>p.costEstimate<20},
  {id:'u30',label:'Under 30 min',fn:p=>driveMin(Store.here(),p.coordinates)<=30},
  {id:'u60',label:'Under 1 hour',fn:p=>driveMin(Store.here(),p.coordinates)<=60},
  {id:'indoor',label:'Indoor',fn:p=>p.tags.includes('indoor')},
  {id:'outdoor',label:'Outdoor',fn:p=>p.tags.includes('outdoor')},
  {id:'rain',label:'Rain friendly',fn:p=>p.weatherSuitability==='rain'||p.tags.includes('rain-ok')},
  {id:'hot',label:'Hot weather',fn:p=>p.tags.includes('hot-ok')||p.tags.includes('shade')},
  {id:'quiet',label:'Not touristy',fn:p=>p.crowdLevel<=2},
];
function applyFilters(list,active){
  let out=list;
  for(const id of active){ const f=FILTERS.find(x=>x.id===id); if(f) out=out.filter(f.fn); }
  return out;
}

  },
  planCard(plan,i){

          <span class="n">${esc(s.name)}${s.kind==='place'?'':''}</span>

        </div>
        <div class="d" style="grid-column:2/4;margin:-7px 0 0">${esc(s.detail||'')}</div>`).join('')}</div>
      <div class="row wrap" style="gap:8px;margin-top:14px">
        <button class="btn primary sm" data-startday="${plan.id}">Start this day</button>
        <button class="btn sm" data-planroute="${plan.id}">View on map</button>
      </div>

        ${[['less-driving','Less driving'],['food','More food'],['nature','More nature'],['towns','More towns'],['relax','More relaxing']]
          .map(([k,l])=>`<button class="pill" data-nudge="${plan.id}:${k}">${l}</button>`).join('')}
      </div></div>`;
  },
  scorecard(p,w){
    const rows=[['Detour',w.detourLabel],['Drive',`${mins2h(w.min)} · ${w.km} km`],['Visit',w.visTxt],['Cost',w.cost],
      ['Parking',(PARK[p.parkingDifficulty]||{}).l],['Dogs',(DOG[p.dogStatus]||{}).l],
      ['Crowds',CROWD[p.crowdLevel]],['Best time',{morning:'Morning',evening:'Late afternoon',lunch:'Lunchtime',any:'Any time'}[p.bestTime]]];
    return `<div class="score">${rows.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${esc(v||'—')}</div></div>`).join('')}</div>`;
  },
  /* The live day: what is happening now, what is next, will we make it back */
  todayStrip(){
    const act=Today.active; if(!act) return '';
    const {a,plan}=act;
    if(Today.isFuture()) return `
      <div class="card" style="border-color:var(--gold)">
        <div class="between"><div class="tag" style="font-family:var(--display);color:var(--gold);font-size:11.5px;font-weight:700;letter-spacing:.06em">READY FOR ${new Date(a.date).toLocaleDateString([], {weekday:'long'}).toUpperCase()}</div></div>
        <h2 style="margin:3px 0 8px">${esc(plan.title)}</h2>
        <div class="sm t2">${plan.stops.filter(x=>x.placeId).length} stops · ${mins2h(plan.driveMin)} driving · first stop ${plan.stops[0].time}</div>
        <div class="row" style="gap:8px;margin-top:12px">
          <button class="btn primary sm" data-tdstart>Start it now</button>
          <button class="btn sm" data-plan="${plan.id}">Look at it</button>
          <button class="btn sm ghost" data-tdcancel>Forget it</button></div></div>`;
    if(!Today.isToday()) return '';
    Today.retime();
    const s=Today.stop(), st=Today.status();
    const pl=s&&s.placeId?getPlace(s.placeId):null;
    const pct=st.total?Math.round(st.done/st.total*100):0;
    const dist=(Geo.live&&pl)?haversine({lat:Geo.live.lat,lng:Geo.live.lng},pl.coordinates):null;
    const leaveBy=(()=>{ if(!a.at||!s) return null;
      const left=Math.max(0,(s.dur||45)-Today.elapsedHere());
      const d=new Date(Date.now()+left*60000); return pad(d.getHours())+':'+pad(d.getMinutes()); })();
    const next=plan.stops.slice(a.idx+1).filter(x=>x.placeId||x.kind==='end').slice(0,3);

    let head, sub, actions;
    if(s&&s.kind==='end'){
      head=`Head back to ${esc(Store.here().name)}`;
      sub=`${mins2h(s.legMin||0)} drive · home about ${s.eta||s.time}`;
      actions=`<button class="btn primary grow" data-tdend>Finish the day</button>`;
    } else if(a.at){
      head=`At ${esc(s.name)}`;
      sub=`${Today.elapsedHere()} min here${leaveBy?` · leave by ${leaveBy} to stay on plan`:''}`;
      actions=`<button class="btn primary grow" data-tddone>Done here</button>
        <button class="btn" data-tdlinger="30">+30 min</button>`;
    } else {
      head=`Driving to ${esc(s.name)}`;
      sub=`${mins2h(s.legMin||0)}${pl?` · ${driveKm(Store.here(),pl.coordinates)} km`:''} · arrive about ${s.eta||s.time}${dist!=null?` · ${dist<1?Math.round(dist*1000)+' m':dist.toFixed(1)+' km'} away`:''}`;
      actions=`<button class="btn primary grow" data-tdarrive>We are here</button>
        <button class="btn" data-tdskip>Skip</button>`;
    }
    return `
    <div class="card" style="border-color:var(--gold);padding:15px">
      <div class="between">
        <div style="font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--gold)">RIGHT NOW</div>
        <div class="sm mut">${st.done} of ${st.total} done${st.skipped?` · ${st.skipped} skipped`:''}</div>
      </div>
      <div class="bar" style="margin:8px 0 12px"><i style="width:${clamp(pct,3,100)}%"></i></div>
      <h2>${head}</h2>
      <div class="sm t2" style="margin-top:5px">${sub}</div>
      ${pl?`<div class="sm mut" style="margin-top:6px">${esc(pl.why.split('.')[0])}.</div>`:''}
      <div class="row" style="gap:8px;margin-top:13px">${actions}</div>
      ${next.length?`<div class="tl" style="margin-top:15px">${next.map(x=>`
        <div class="stop"><span class="t">${x.eta||x.time}</span><span class="n">${esc(x.name)}</span>
        ${x.placeId?`<button class="pill" data-place="${x.placeId}">open</button>`:''}</div>`).join('')}</div>`:''}
      <div class="${st.late?'banner':'sm mut'}" style="margin-top:13px">
        ${st.late
          ? `Back about ${st.etaHome}, ${mins2h(st.diff)} later than you wanted.${st.remaining.length?' Dropping a stop would fix it.':''}
             ${st.remaining.length?`<button class="btn sm" data-tddrop>Drop the last stop</button>`:''}`
          : `Back about ${st.etaHome}${st.diff<-30?', comfortably early — there is room for one more stop':''}.`}
      </div>
      <div class="row wrap" style="gap:6px;margin-top:10px">
        <button class="pill" data-planroute="${plan.id}">Show on map</button>
        <button class="pill" data-plan="${plan.id}">Whole day</button>
        <button class="pill" data-tdend>End the day</button>
      </div>
    </div>`;
  },
  weatherStrip(){
    const w=Weather.now;
    if(!w) return `<div class="sm mut">${Weather.loading?'Checking the sky…':'Weather unavailable'}</div>`;
    return `<div class="row sm" style="gap:8px">
      <span style="font-size:19px">${Weather.icon(w.code)}</span>
      <strong style="font-family:var(--display);font-size:17px">${w.temp}°</strong>
      <span class="t2">${esc(Weather.desc(w.code))}</span>
      <span class="mut">·</span><span class="t2">${w.rain}% rain</span>
      ${w.stale?'<span class="pill warn">'+esc(w.source)+'</span>':''}</div>`;
  }
};

const Views={
  tab:'home', exploreCat:'detour', exploreFilters:new Set(), savedTab:'saved', showOptions:false,
  eventRadius:50, eventWhen:'week', plans:[],

  render(){
    const v=$('#view'); if(!v) return;
    $('#topbar').innerHTML=this.topbar();
    document.body.classList.toggle('mapmode',this.tab==='map');

    v.style.display = this.tab==='map'?'none':'block';
    if(this.tab!=='map') v.innerHTML=this[this.tab]?.()||'';
    if(this.tab==='map') MapView.mount();
    this.nav();
  },
  nav(){
    $('#nav').innerHTML=[['home','Home'],['explore','Explore'],['map','Map'],['trip','Trip'],['saved','Saved']]
      .map(([k,l])=>`<button data-tab="${k}" class="${this.tab===k?'on':''}">${ICONS[k]}<span>${l}</span></button>`).join('');
  },
  topbar(){
    const dog=Store.s.prefs.dogMode;
    return `<div class="between">
      <div class="row grow" style="min-width:0">
        <div class="brandmark">${ICONS.pin}</div>
        <div class="grow" style="min-width:0">

      </div>

    </div>`;
  },

  /* ---------------- HOME ---------------- */
  home(){
    const h=new Date().getHours();
    const greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    const w=Weather.now, here=Store.here(), base=Store.base(), next=Store.nextBase();
    if(!this.plans.length) this.regenPlans();
    const evs=Events.near(this.eventRadius,'today').slice(0,4);
    const region=Store.region();
    const foods=FOODS.filter(f=>f.region===region).slice(0,6);
    const nearby=allPlaces().map(p=>({p,m:driveMin(here,p.coordinates)}))
      .filter(x=>x.m<=75 && !Store.visit(x.p.id))
      .filter(x=>!Store.s.prefs.dogMode||['in','leash','out'].includes(x.p.dogStatus))
      .sort((a,b)=>(b.p.scenic+b.p.uniqueness+b.p.foodValue-b.m/22)-(a.p.scenic+a.p.uniqueness+a.p.foodValue-a.m/22))
      .slice(0,8).map(x=>x.p);
    const recent=Store.s.visited.slice(0,5).map(v=>getPlace(v.placeId)).filter(Boolean);
    const dogPlaces=allPlaces().map(p=>({p,m:driveMin(here,p.coordinates)}))
      .filter(x=>x.m<=60&&(x.p.dogStatus==='in'||x.p.dogStatus==='leash'||x.p.tags.includes('dog')))
      .sort((a,b)=>a.m-b.m).slice(0,6).map(x=>x.p);

    return `
    ${Shell.offline?`<div class="banner" style="margin-bottom:12px">📡 Offline. Showing saved trip data${w&&w.stale?' and the last weather reading':''}.</div>`:''}
    <div style="margin:2px 0 4px">
      <h1>${greet}</h1>
      <div class="between" style="margin-top:6px">
        ${UI.weatherStrip()}
        <button class="pill" data-sheet="weather">Forecast</button>
      </div>
    </div>

    ${Geo.status!=='ok'&&!Store.s.manualLocation?`
      <div class="banner" style="margin-top:12px">
        <div class="grow">${Geo.status==='denied'?'Location is off — using your base in '+esc(base.name)+'.':'Use your real position for distances?'}</div>
        <button class="btn sm" data-geo>${Geo.status==='denied'?'Change base':'Use GPS'}</button>
      </div>`:''}

    ${Today.active?`<div class="sect">${UI.todayStrip()}</div>`:''}

    <div class="sect">
      <h2>${Today.active&&Today.isToday()?'Something else instead?':'What shall we do today?'}</h2>
      <div class="sm mut" style="margin:4px 0 12px">Built for ${esc(here.name)}, ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}, ${Weather.mood()==='rain'?'wet weather':Weather.mood()==='hot'?'heat':'good weather'}${Store.s.prefs.dogMode?', dog with us':''}.</div>
      <div class="stack" style="gap:12px">${
        (Today.active&&Today.isToday()&&!this.showOptions)
          ? `<button class="btn block" data-showopts>Show three other options</button>`
          : this.plans.map((p,i)=>UI.planCard(p,i)).join('')}</div>
      <div class="row" style="gap:8px;margin-top:12px">
        <button class="btn block" data-sheet="planner">Plan a different day</button>
        <button class="iconbtn" data-regen aria-label="Regenerate">${ICONS.spark}</button>
      </div>
    </div>

    <div class="sect">
      <h2>Quick actions</h2>
      <div class="qgrid" style="margin-top:10px">
        ${[['ask','🧭','What should we do?'],['food','🍽️','Find food'],['view','👁️','Find a viewpoint'],
           ['dog','🐕','Dog-friendly place'],['events','🎉','Nearby event'],['parking','🅿️','Where did we park?'],
           ['savehere','📍','Save this place'],['tomorrow','📅','Plan tomorrow']]
          .map(([k,i,l])=>`<button class="qa" data-quick="${k}"><span class="i">${i}</span>${l}</button>`).join('')}
      </div>
    </div>

    <div class="sect">
      <div class="between"><h2>Near you</h2><button class="link" data-tab="explore">All places</button></div>
      <div class="hscroll">${nearby.map(p=>UI.placeCardV(p)).join('')||'<div class="mut sm">Nothing within 75 minutes.</div>'}</div>
    </div>

    ${Store.s.prefs.dogMode?`<div class="sect">
      <div class="between"><h2>Good with the dog</h2></div>
      <div class="stack">${dogPlaces.map(p=>UI.placeRow(p)).join('')}</div>
    </div>`:''}

    <div class="sect">
      <div class="between"><h2>Happening today</h2><button class="link" data-sheet="events">Events radar</button></div>
      <div class="stack">${evs.length?evs.map(e=>`
        <button class="card" data-event="${e.id}" style="text-align:left">
          <div class="between"><h3>${Events.kindEmoji(e.kind)} ${esc(e.name)}</h3><span class="pill">${e.km} km</span></div>
          <div class="sm t2" style="margin-top:6px">${esc(e.why)}</div>
          <div class="row" style="gap:6px;margin-top:8px"><span class="pill">${e.time}</span><span class="pill">${esc(e.cost)}</span>${e.dogFriendly?'<span class="pill good">🐕 fine</span>':'<span class="pill bad">🐕 no</span>'}</div>
        </button>`).join(''):'<div class="card mut sm">Nothing on within '+this.eventRadius+' km today. Try tomorrow or widen the radius.</div>'}</div>
    </div>

    <div class="sect">
      <div class="between"><h2>Worth tasting here</h2><button class="link" data-sheet="food">Food hunter</button></div>
      <div class="hscroll">${foods.map(f=>`
        <button class="card" data-food="${f.id}" style="text-align:left;width:190px">
          <div style="font-size:24px">${f.emoji}</div>
          <h3 style="margin-top:6px">${esc(f.name)}</h3>
          <div class="sm mut" style="margin-top:4px">${esc(f.priceRange)}</div>
          <div class="sm t2" style="margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(f.what)}</div>
        </button>`).join('')}</div>
    </div>

    <div class="sect">
      <h2>Next stop</h2>
      ${next?`<button class="card" data-sheet="trip" style="text-align:left;width:100%;margin-top:10px">
        <div class="between"><h3>${REGIONS[next.region].flag} ${esc(next.name)}</h3><span class="pill">${driveMin(base.coordinates,next.coordinates)>0?mins2h(driveMin(base.coordinates,next.coordinates)):'—'} drive</span></div>
        <div class="sm mut" style="margin-top:6px">${esc(next.accommodation||'')} · from ${esc(next.arrival)}</div>
        <div class="sm t2" style="margin-top:6px">${driveKm(base.coordinates,next.coordinates)} km from ${esc(base.name)}</div>
      </button>`:'<div class="card mut sm">Last base of the trip. Add another in Trip.</div>'}
    </div>

    ${recent.length?`<div class="sect">
      <div class="between"><h2>Recently visited</h2><button class="link" data-tab="saved">Memory map</button></div>
      <div class="stack">${recent.map(p=>UI.placeRow(p)).join('')}</div>
    </div>`:''}
    <div style="height:8px"></div>`;
  },
  regenPlans(){
    /* Each option avoids the previous option's stops, so the three genuinely differ. */
    const used=[]; this.plans=[];
    for(const k of ['relaxed','explore','adventure']){
      let p=Planner.build(k,{exclude:used});
      if(!p) p=Planner.build(k);
      if(!p) continue;
      p.stops.filter(s=>s.placeId).forEach(s=>used.push(s.placeId));
      this.plans.push(p); Store.savePlan(p);
    }
  },

  /* ---------------- EXPLORE ---------------- */
  explore(){
    const here=Store.here();
    let list=allPlaces().filter(p=>this.exploreCat==='detour'
        ? (p.scenic+p.uniqueness+p.foodValue)>=7
        : this.exploreCat==='dogf' ? ['in','leash'].includes(p.dogStatus)
        : this.exploreCat==='mine' ? p.source==='user'
        : p.category===this.exploreCat||p.tags.includes(this.exploreCat));
    list=applyFilters(list,this.exploreFilters);
    if(Store.s.prefs.dogMode) list=list.filter(p=>['in','leash','out'].includes(p.dogStatus));
    list=list.map(p=>({p,m:driveMin(here,p.coordinates)})).sort((a,b)=>a.m-b.m).map(x=>x.p);
    const cats=[['detour','Worth a detour'],['food','Food'],['nature','Nature'],['village','Villages'],['city','Cities'],
      ['beach','Beaches'],['hike','Hikes'],['view','Viewpoints'],['market','Markets'],['castle','Castles'],
      ['motorsport','Motorsport'],['dogf','Dog friendly'],['product','Local products'],['mine','Your finds']];
    return `
    <button class="card row" data-sheet="find" style="width:100%;margin-bottom:12px;padding:12px 14px;text-align:left">
      <span style="opacity:.6">${ICONS.explore}</span>
      <span class="grow mut">Search anywhere, or paste coordinates</span></button>
    <div class="chiprow" style="margin-bottom:8px">${cats.map(([k,l])=>
      `<button class="chip ${this.exploreCat===k?'on':''}" data-ecat="${k}">${CATS[k]?CATS[k].e+' ':k==='dogf'?'🐕 ':''}${l}</button>`).join('')}</div>
    <div class="chiprow" style="margin-bottom:12px">${FILTERS.map(f=>
      `<button class="chip ${this.exploreFilters.has(f.id)?'on':''}" data-efil="${f.id}">${f.label}</button>`).join('')}</div>
    <div class="between" style="margin-bottom:8px">
      <div class="sm mut">${list.length} place${list.length===1?'':'s'}, nearest first</div>
      <button class="link" data-sheet="route">Scenic route</button>
    </div>
    <div class="stack">${list.length?list.map(p=>UI.placeRow(p)).join(''):
      this.exploreCat==='mine'
        ? `<div class="empty"><span class="em">📍</span>Places you add appear here. Search for one, or press and hold the map.</div>`
        : `<div class="empty"><span class="em">🧭</span>Nothing matches those filters. Clear a few and try again.</div>`}</div>`;
  },

  /* ---------------- TRIP ---------------- */
  trip(){
    const t=Store.s.trip, active=Store.base();
    const byCountry={};
    t.bases.forEach(b=>{const c=REGIONS[b.region].country;(byCountry[c]=byCountry[c]||[]).push(b);});
    const totalKm=t.bases.reduce((a,b,i)=>i?a+driveKm(t.bases[i-1].coordinates,b.coordinates):0,0);
    return `
    <h1>${esc(t.name)}</h1>
    <div class="sm mut" style="margin:6px 0 14px">${t.startDate} → ${t.endDate} · ${t.bases.length} bases · ≈ ${totalKm} km of driving</div>
    <div class="row" style="gap:8px;margin-bottom:16px">
      <button class="btn sm" data-addbase>Add a base</button>
      <button class="btn sm" data-sheet="route">Plan a drive</button>
      <button class="btn sm" data-sheet="parking">Parking</button>
    </div>
    ${Object.entries(byCountry).map(([c,bases])=>`
      <div class="sect">
        <h2>${REGIONS[bases[0].region].flag} ${esc(c)}</h2>
        <div class="tlday" style="margin-top:12px">
          ${bases.map((b,i)=>{
            const prev=t.bases[t.bases.indexOf(b)-1];
            const nights=Math.max(1,Math.round((new Date(b.departure)-new Date(b.arrival))/864e5));
            const saved=Store.s.saved.map(s=>getPlace(s.placeId)).filter(p=>p&&driveMin(b.coordinates,p.coordinates)<=45).length;
            return `<div style="position:relative;margin-bottom:12px">
              <span class="dot ${b.id===active.id?'on':''}"></span>
              <button class="card" data-base="${b.id}" style="text-align:left;width:100%;${b.id===active.id?'border-color:var(--gold)':''}">
                <div class="between"><h3>${esc(b.name)}</h3>${b.id===active.id?'<span class="pill warn">You are here</span>':''}</div>
                <div class="sm mut" style="margin-top:4px">${esc(REGIONS[b.region].name)} · ${b.arrival} → ${b.departure} · ${nights} night${nights===1?'':'s'}</div>
                <div class="sm t2" style="margin-top:7px">🏠 ${esc(b.accommodation||'Not set')}</div>
                ${b.parking?`<div class="sm t2">🅿️ ${esc(b.parking)}</div>`:''}
                ${prev?`<div class="sm mut" style="margin-top:6px">${driveKm(prev.coordinates,b.coordinates)} km · ${mins2h(driveMin(prev.coordinates,b.coordinates))} from ${esc(prev.name)}</div>`:''}
                ${saved?`<div class="row" style="gap:6px;margin-top:8px"><span class="pill">${saved} saved nearby</span></div>`:''}
              </button></div>`;
          }).join('')}
        </div>
      </div>`).join('')}
    <div class="sect"><button class="btn block ghost" data-export>Export trip data</button></div>`;
  },

  /* ---------------- SAVED / MEMORY ---------------- */
  saved(){
    const tabs=[['saved','Saved'],['visited','Visited'],['timeline','Diary'],['stats','Trip so far']];
    const body=this['sv_'+this.savedTab]();
    return `<div class="seg" style="margin-bottom:14px">${tabs.map(([k,l])=>
      `<button data-stab="${k}" class="${this.savedTab===k?'on':''}">${l}</button>`).join('')}</div>${body}`;
  },
  sv_saved(){

    if(!list.length) return `<div class="empty"><span class="em">🔖</span>Nothing saved yet. Tap the bookmark on any place and it stays available offline.</div>`;

  sv_visited(){

  },
  sv_timeline(){
