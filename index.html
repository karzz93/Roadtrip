      ...Store.s.foodLog.map(f=>({d:f.date,t:'food',n:FOODS.find(x=>x.id===f.foodId)?.name,x:'bought'})),
      ...Store.s.dayLog.map(l=>({d:l.date,t:'day',n:l.title,x:`${l.done}/${l.done+l.skipped} stops`})),
      ...Store.s.plans.slice(0,10).filter(p=>!Store.s.dayLog.some(l=>l.planId===p.id)).map(p=>({d:p.date,t:'plan',n:p.title,x:mins2h(p.driveMin)}))
    ].filter(i=>i.n).sort((a,b)=>a.d<b.d?1:-1);
    if(!items.length) return `<div class="empty"><span class="em">📖</span>Your diary fills itself as you visit places, buy food and run day plans.</div>`;
    let last='';
    return `<div class="tlday">${items.map(i=>{
      const head=i.d!==last; last=i.d;
      return `${head?`<div class="sm mut" style="margin:14px 0 6px;position:relative"><span class="dot on"></span>${new Date(i.d).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})}</div>`:''}
        <div class="card" style="margin-bottom:8px"><div class="between"><div class="grow"><strong>${i.t==='food'?'🧺 ':i.t==='plan'?'🧭 ':i.t==='day'?'🚗 ':'📍 '}${esc(i.n)}</strong></div><span class="pill">${esc(i.x||'')}</span></div></div>`;
    }).join('')}</div>`;
  },
  sv_stats(){
    const v=Store.s.visited, km=Store.s.trip.bases.reduce((a,b,i,arr)=>i?a+driveKm(arr[i-1].coordinates,b.coordinates):0,0);
    const regions=[...new Set(v.map(x=>getPlace(x.placeId)?.region).filter(Boolean))];
    const countries=[...new Set(regions.map(r=>REGIONS[r].country))];
    const loved=v.filter(x=>x.rating==='loved').map(x=>getPlace(x.placeId)).filter(Boolean);
    const foods=Store.s.foodLog.map(f=>FOODS.find(x=>x.id===f.foodId)).filter(Boolean);
    const done=v.length, total=allPlaces().length;
    return `
    <div class="card"><div class="between"><h3>Places visited</h3><strong style="font-family:var(--display);font-size:24px">${done}</strong></div>
      <div class="bar" style="margin-top:10px"><i style="width:${clamp(done/total*100,2,100)}%"></i></div>
      <div class="sm mut" style="margin-top:6px">${done} of ${total} places in the guide</div></div>
    <div class="row" style="gap:10px;margin-top:10px">
      <div class="card grow"><div class="sm mut">Countries</div><strong style="font-family:var(--display);font-size:20px">${countries.length}</strong><div class="sm t2">${countries.join(', ')||'—'}</div></div>
      <div class="card grow"><div class="sm mut">Base-to-base</div><strong style="font-family:var(--display);font-size:20px">${km} km</strong><div class="sm t2">planned driving</div></div>
      <div class="card grow"><div class="sm mut">Days out</div><strong style="font-family:var(--display);font-size:20px">${Store.s.dayLog.length}</strong><div class="sm t2">${Math.round(Store.s.dayLog.reduce((a,l)=>a+(l.driveMin||0),0)/60)}h driving</div></div>
    </div>
    <div class="sect"><h2>Favourites</h2>
      <div class="stack" style="margin-top:10px">${loved.length?loved.map(p=>UI.placeRow(p)).join(''):'<div class="card mut sm">Rate a place “Loved it” and it lands here.</div>'}</div></div>
    <div class="sect"><h2>Food bought</h2>
      <div class="row wrap" style="gap:8px;margin-top:10px">${foods.length?foods.map(f=>`<span class="pill">${f.emoji} ${esc(f.name)}</span>`).join(''):'<div class="card mut sm">Nothing logged yet.</div>'}</div></div>
    <div class="sect"><button class="btn block" data-tab="map">See the memory map</button></div>`;
  },
};

/* =====================================================================
   6. MAP — canvas slippy map. Draws OSM raster tiles when the network
   allows it, and falls back to a readable abstract basemap offline.
   ===================================================================== */
const MapView=(()=>{
  let cv,ctx,wrap,mkl,W=0,H=0,dpr=1;
  let center={lat:43.31,lng:-2.0}, zoom=7.2, tilesOK=true, fails=0;
  const cache=new Map();
  let mounted=false, filter='all';
  const worldPx=z=>256*Math.pow(2,z);
  const lng2x=(lng,z)=>(lng+180)/360*worldPx(z);
  const lat2y=(lat,z)=>{const s=Math.sin(lat*Math.PI/180);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*worldPx(z);};
  const x2lng=(x,z)=>x/worldPx(z)*360-180;
  const y2lat=(y,z)=>{const n=Math.PI-2*Math.PI*y/worldPx(z);return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));};
  const toScreen=(ll)=>({x:(lng2x(ll.lng,zoom)-lng2x(center.lng,zoom))+W/2,y:(lat2y(ll.lat,zoom)-lat2y(center.lat,zoom))+H/2});

  function ensure(){
    if(wrap) return;
    wrap=el(`<div id="mapwrap" style="display:none">
      <canvas id="mapcv"></canvas><div id="mkl"></div>
      <div class="maptools">
        <button class="iconbtn" data-mapz="1" aria-label="Zoom in"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
        <button class="iconbtn" data-mapz="-1" aria-label="Zoom out"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        <button class="iconbtn" data-maphere aria-label="Centre on me">${ICONS.pin}</button>
        <button class="iconbtn" data-sheet="find" aria-label="Search for a place">${ICONS.explore}</button>
      </div>
      <div class="chiprow" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 68px);left:0;right:0;margin:0;padding:0 12px">
        ${[['all','All'],['saved','Saved'],['visited','Visited'],['food','Food'],['nature','Nature'],['event','Events'],['dog','Dog friendly'],['parking','Car']]
          .map(([k,l])=>`<button class="chip" data-mfil="${k}">${l}</button>`).join('')}
      </div>
      <div class="attrib" id="attrib"></div>
      <div class="banner" style="position:absolute;left:12px;right:60px;bottom:52px;font-size:12px">Press and hold the map to save a spot</div></div>`);
    document.body.appendChild(wrap);
    cv=$('#mapcv',wrap); ctx=cv.getContext('2d'); mkl=$('#mkl',wrap);
    bindGestures();
    window.addEventListener('resize',()=>{resize();draw();});
  }
  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=wrap.clientWidth; H=wrap.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function tile(z,x,y){
    const key=z+'/'+x+'/'+y;
    if(cache.has(key)) return cache.get(key);
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{img.ok=true;draw();};
    img.onerror=()=>{img.bad=true;if(++fails>5){tilesOK=false;draw();}};
    img.src=Config.tiles.url.replace('{z}',z).replace('{x}',x).replace('{y}',y);
    cache.set(key,img); if(cache.size>260){const k=cache.keys().next().value;cache.delete(k);}
    return img;
  }
  function bg(){
    /* Abstract basemap: land wash, graticule, region labels. Always available. */
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1b232b'); g.addColorStop(1,'#141a20');
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--surf2')||'#20262e';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(127,140,153,.22)'; ctx.lineWidth=1;
    for(let lat=Math.floor(y2lat(lat2y(center.lat,zoom)+H/2,zoom));lat<=Math.ceil(y2lat(lat2y(center.lat,zoom)-H/2,zoom));lat+=0.5){
      const y=toScreen({lat,lng:center.lng}).y; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    for(let lng=Math.floor(x2lng(lng2x(center.lng,zoom)-W/2,zoom));lng<=Math.ceil(x2lng(lng2x(center.lng,zoom)+W/2,zoom));lng+=0.5){
      const x=toScreen({lat:center.lat,lng}).x; ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    ctx.fillStyle='rgba(127,140,153,.85)'; ctx.font='600 11px Inter,sans-serif';
    for(const r of Object.values(REGIONS)){ const s=toScreen(r.c);
      if(s.x>-40&&s.x<W+40&&s.y>0&&s.y<H) ctx.fillText(r.name.toUpperCase(),s.x-r.name.length*3,s.y); }
  }
  function draw(){
    if(!ctx||!W||!H) return;
    ctx.clearRect(0,0,W,H);
    if(tilesOK){
      const z=clamp(Math.round(zoom),3,Config.tiles.maxZoom), sc=Math.pow(2,zoom-z), ts=256*sc;
      const cx=lng2x(center.lng,z)*sc, cy=lat2y(center.lat,z)*sc;
      const x0=Math.floor((cx-W/2)/ts), x1=Math.floor((cx+W/2)/ts);
      const y0=Math.floor((cy-H/2)/ts), y1=Math.floor((cy+H/2)/ts);
      const n=Math.pow(2,z); let drew=0;
      ctx.fillStyle='#22282f'; ctx.fillRect(0,0,W,H);
      for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
        if(y<0||y>=n) continue; const tx=((x%n)+n)%n;
        const img=tile(z,tx,y);
        const px=Math.round(x*ts-cx+W/2), py=Math.round(y*ts-cy+H/2);
        if(img.ok){ ctx.drawImage(img,px,py,Math.ceil(ts),Math.ceil(ts)); drew++; }
      }
      if(!drew&&fails>5) tilesOK=false;
      if(!tilesOK) bg();
    } else bg();
    $('#attrib').textContent = tilesOK?Config.tiles.attribution:'Offline basemap · positions are accurate, detail is not';
    markers();
  }
  function items(){
    const out=[];
    const wantAll=filter==='all';
    for(const p of allPlaces()){
      const sv=Store.isSaved(p.id), vs=!!Store.visit(p.id);
      let ok=wantAll||(filter==='saved'&&sv)||(filter==='visited'&&vs)||
        (filter==='food'&&(p.category==='food'||p.tags.includes('food')))||
        (filter==='nature'&&['nature','hike','beach','view'].includes(p.category))||
        (filter==='dog'&&['in','leash'].includes(p.dogStatus));
      if(wantAll&&Store.s.prefs.dogMode&&p.dogStatus==='no') ok=false;
      if(ok) out.push({ll:p.coordinates,kind:sv?'sv':vs?'vs':'pl',e:CATS[p.category].e,id:p.id,type:'place'});
    }
    if(wantAll||filter==='event') for(const e of Events.near(200,'week')) out.push({ll:e.coordinates,kind:'ev',e:Events.kindEmoji(e.kind),id:e.id,type:'event'});
    if((wantAll||filter==='parking')&&Store.s.parking) out.push({ll:Store.s.parking.coordinates,kind:'pk',e:'🚗',id:'car',type:'parking'});
    for(const b of Store.s.trip.bases) if(wantAll||filter==='saved') out.push({ll:b.coordinates,kind:'bs',e:'🏠',id:b.id,type:'base'});
    return out;
  }
  function markers(){
    const list=items().map(i=>({...i,s:toScreen(i.ll)})).filter(i=>i.s.x>-60&&i.s.x<W+60&&i.s.y>-60&&i.s.y<H+60);
    /* grid clustering */
    const cell=62, grid=new Map();
    for(const i of list){ const k=Math.floor(i.s.x/cell)+':'+Math.floor(i.s.y/cell);
      (grid.get(k)||grid.set(k,[]).get(k)).push(i); }
    let html='';
    for(const [,g] of grid){
      if(g.length>1&&zoom<11){
        const x=g.reduce((a,i)=>a+i.s.x,0)/g.length, y=g.reduce((a,i)=>a+i.s.y,0)/g.length;
        html+=`<button class="mk cl" style="left:${x}px;top:${y+17}px" data-mcl="${g.map(i=>i.ll.lat.toFixed(3)+','+i.ll.lng.toFixed(3)).join('|')}">${g.length}</button>`;
      } else for(const i of g){
        html+=`<button class="mk ${i.kind}" style="left:${i.s.x}px;top:${i.s.y}px" data-mk="${i.type}:${i.id}"><span>${i.e}</span></button>`;
      }
    }
    const h=Store.here(), hs=toScreen(h);
    html+=`<div class="mk" style="left:${hs.x}px;top:${hs.y}px;background:var(--gold);border-color:transparent"><span>🧭</span></div>`;
    mkl.innerHTML=html;
  }
  function fromScreen(x,y){
    return {lat:clamp(y2lat(lat2y(center.lat,zoom)+(y-H/2),zoom),-84,84),
            lng:x2lng(lng2x(center.lng,zoom)+(x-W/2),zoom)};
  }
  function bindGestures(){
    let drag=null, pinch=null, hold=null;
    const cancelHold=()=>{ if(hold){clearTimeout(hold);hold=null;} };
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY};
      cancelHold();
      hold=setTimeout(()=>{ hold=null; drag=null;
        const r=cv.getBoundingClientRect();
        api.drop(fromScreen(e.clientX-r.left,e.clientY-r.top));
      },550);
    });
    cv.addEventListener('pointermove',e=>{
      if(drag&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>9) cancelHold();
      if(!drag||pinch) return;
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY,x0:drag.x0,y0:drag.y0};
      const cx=lng2x(center.lng,zoom)-dx, cy=lat2y(center.lat,zoom)-dy;
      center={lng:x2lng(cx,zoom),lat:clamp(y2lat(cy,zoom),-84,84)}; draw();
    });
    cv.addEventListener('pointerup',()=>{drag=null;cancelHold();});
    cv.addEventListener('pointercancel',()=>{drag=null;cancelHold();});
    cv.addEventListener('wheel',e=>{e.preventDefault();zoomBy(-e.deltaY/400);},{passive:false});
    cv.addEventListener('touchstart',e=>{ if(e.touches.length===2){drag=null;cancelHold();
      pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);} },{passive:true});
    cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      zoomBy(Math.log2(d/pinch)); pinch=d; } },{passive:true});
    cv.addEventListener('touchend',()=>{pinch=null;});
    let lastTap=0;
    cv.addEventListener('click',()=>{const t=Date.now(); if(t-lastTap<300) zoomBy(1); lastTap=t;});
  }
  function zoomBy(d){ zoom=clamp(zoom+d,3,Config.tiles.maxZoom); draw(); }
  const api={
    mount(){ ensure(); wrap.style.display='block'; if(!mounted){ mounted=true; const h=Store.here(); center={lat:h.lat,lng:h.lng}; zoom=9; }
      resize(); draw(); wrap.querySelectorAll('[data-mfil]').forEach(b=>b.classList.toggle('on',b.dataset.mfil===filter)); },
    setFilter(f){ filter=f; wrap.querySelectorAll('[data-mfil]').forEach(b=>b.classList.toggle('on',b.dataset.mfil===f)); draw(); },
    zoomBy, draw,
    goto(ll,z){ ensure(); center={lat:ll.lat,lng:ll.lng}; if(z)zoom=z; Views.tab='map'; Views.render(); },
    fit(lls){ ensure(); if(!lls.length) return;
      const lats=lls.map(l=>l.lat), lngs=lls.map(l=>l.lng);
      center={lat:(Math.min(...lats)+Math.max(...lats))/2,lng:(Math.min(...lngs)+Math.max(...lngs))/2};
      const span=Math.max(Math.max(...lats)-Math.min(...lats),(Math.max(...lngs)-Math.min(...lngs))*0.7);
      zoom=clamp(Math.log2(360/Math.max(0.05,span))-0.4,4,13);
      Views.tab='map'; Views.render(); },
    center(){ return center; },
    fromScreen,
    /* press and hold anywhere: name the spot, then offer to save it */
    async drop(ll){
      Shell.toast('Looking up that spot…');
      const r=await Geocode.reverse(ll.lat,ll.lng);
      Sheets.open('newplace',{name:r?r.name:'Dropped pin',detail:r?r.detail:'Coordinates from the map',lat:ll.lat,lng:ll.lng});
    }
  };
  return api;
})();

/* =====================================================================
   7. SHEETS
   ===================================================================== */
const Sheets={
  open(name,arg){
    const s=this[name]?.(arg); if(!s) return;
    const scrim=el('<div class="scrim"></div>');
    const sheet=el(`<div class="sheet"><div class="grab"></div>
      <div class="hd"><div class="grow"><h2>${s.title}</h2>${s.sub?`<div class="sm mut" style="margin-top:3px">${s.sub}</div>`:''}</div>
      <button class="iconbtn" data-close aria-label="Close"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="sc">${s.body}</div></div>`);
    $('#layers').append(scrim,sheet);
    requestAnimationFrame(()=>{scrim.classList.add('in');sheet.classList.add('in');});
    scrim.addEventListener('click',()=>Sheets.close());
    this._cur={scrim,sheet,name,arg}; s.after?.(sheet);
  },
  close(){ const c=this._cur; if(!c) return; this._cur=null;
    c.sheet.classList.remove('in'); c.scrim.classList.remove('in');
    setTimeout(()=>{c.sheet.remove();c.scrim.remove();},260); },
  refresh(){ const c=this._cur; if(!c) return; const {name,arg}=c; this.close(); setTimeout(()=>this.open(name,arg),20); },

  /* ---- place detail ---- */
  place(id){
    const p=getPlace(id); if(!p) return null;
    const w=WorthIt.eval(p), v=Store.visit(id), saved=Store.isSaved(id);
    const foods=FOODS.filter(f=>f.region===p.region).slice(0,4);
    return {title:esc(p.name), sub:`${REGIONS[p.region].flag} ${esc(REGIONS[p.region].name)} · ${CATS[p.category].n}${p.source==='user'?' · your own find':''}`, body:`
      ${UI.thumb(p,'aspect-ratio:16/8;border-radius:16px')}
      <div class="verdict" style="margin:14px 0">${esc(w.verdict)}${w.pair?' '+esc(w.pair):''}</div>
      <p class="t2">${esc(p.why)}</p>
      ${w.flags.map(f=>`<div class="banner" style="margin-top:8px">${esc(f)}</div>`).join('')}
      <div style="margin-top:14px">${UI.scorecard(p,w)}</div>
      ${p.openingHours?`<div class="sm mut" style="margin-top:10px">🕒 ${esc(p.openingHours)}</div>`:''}
      <div class="xs mut" style="margin-top:6px">${p.coordinates.lat.toFixed(4)}, ${p.coordinates.lng.toFixed(4)}${p.address?' · '+esc(p.address):''}</div>
      <div class="row wrap" style="gap:6px;margin-top:12px">${p.tags.filter(t=>!['outdoor','indoor'].includes(t)).map(t=>`<span class="pill">${t.replace('-',' ')}</span>`).join('')}</div>
      <div class="sect"><h3>Dog notes</h3>
        <div class="score" style="margin-top:8px">
          <div><div class="k">Access</div><div class="v">${(DOG[p.dogStatus]||{}).l}</div></div>
          <div><div class="k">Water</div><div class="v">${p.tags.includes('beach')||p.tags.includes('nature')?'Natural water':'Bring a bowl'}</div></div>
          <div><div class="k">Shade</div><div class="v">${p.tags.includes('shade')?'Good':p.tags.includes('beach')?'Little':'Patchy'}</div></div>
          <div><div class="k">Walking</div><div class="v">${p.category==='hike'?'Demanding':p.category==='city'?'Pavement':'Easy'}</div></div>
          <div><div class="k">Hot pavement</div><div class="v">${p.tags.includes('hot-ok')?'Low risk':'Check after 13:00'}</div></div>
          <div><div class="k">On transport</div><div class="v">8 kg — carrier or lap, usually fine</div></div>
        </div></div>
      ${foods.length?`<div class="sect"><h3>Eat or buy here</h3>
        <div class="row wrap" style="gap:8px;margin-top:8px">${foods.map(f=>`<button class="pill" data-food="${f.id}">${f.emoji} ${esc(f.name)}</button>`).join('')}</div></div>`:''}
      <div class="stack" style="margin-top:18px">
        <div class="row" style="gap:8px">
          <button class="btn primary grow" data-save="${id}">${saved?'Remove from saved':'Save this place'}</button>
          <button class="btn" data-showmap="${id}">Map</button>
        </div>
        <div class="row" style="gap:8px">
          ${['loved','good','okay','skip'].map(r=>`<button class="btn sm grow ${v&&v.rating===r?'primary':''}" data-rate="${id}:${r}">${({loved:'Loved it',good:'Good',okay:'Okay',skip:'Would skip'})[r]}</button>`).join('')}
        </div>
        <textarea rows="2" placeholder="Notes for later…" data-note="${id}">${esc(Store.s.notes[id]||'')}</textarea>
        ${p.source==='user'?`<div class="row" style="gap:8px">
          <button class="btn sm grow" data-editplace="${id}">Edit the details</button>
          <button class="btn sm ghost" data-delplace="${id}">Delete</button></div>`:''}
        ${v?`<button class="btn ghost sm" data-unvisit="${id}">Remove from visited</button>`:''}
      </div>`};
  },

  /* ---- day planner ---- */
  planner(){
    const pr=Store.s.prefs;
    const tags=['food','nature','scenic-road','village','city','beach','hike','market','castle','history','festival','product','view','motorsport'];
    return {title:'Plan a day', sub:'Realistic timings, including driving and lunch', body:`
      <div class="stack" style="gap:12px">
        <div class="fld"><label>Starting from</label>
          <select id="pl-from">${Store.s.trip.bases.map(b=>`<option value="${b.id}" ${b.id===Store.s.activeBaseId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
        <div class="row" style="gap:10px">
          <div class="fld grow"><label>Leave at</label><input id="pl-start" type="time" value="${pr.startTime}"></div>
          <div class="fld grow"><label>Back by</label><input id="pl-end" type="time" value="${pr.returnTime}"></div>
        </div>
        <div class="fld"><label>Maximum driving, one way</label>
          <select id="pl-drive">${[30,45,60,90,120,180].map(m=>`<option value="${m}" ${m===pr.maxDriveMin?'selected':''}>${mins2h(m)}</option>`).join('')}</select></div>

        <button class="btn primary block" data-plgen>Generate the day</button>
        <div id="pl-out"></div>
      </div>`};

  plan(id){
    const p=Store.s.plans.find(x=>x.id===id); if(!p) return null;
    return {title:esc(p.title), sub:`${p.date} · ${mins2h(p.driveMin)} driving · ≈ €${p.cost}`, body:`
      ${UI.planCard(p)}
      <div class="sect"><h3>Stops in detail</h3>
        <div class="stack" style="margin-top:10px">${p.stops.filter(s=>s.placeId).map(s=>UI.placeRow(getPlace(s.placeId))).join('')}</div></div>`};
  },

  /* ---- weather ---- */
  weather(){
    const w=Weather.now;
    if(!w) return {title:'Weather',body:'<div class="empty">No reading yet. <button class="btn sm" data-wrefresh>Try again</button></div>'};
    const mood=Weather.mood();
    const advice=mood==='rain'
      ? 'Rain plan: market halls, arcaded old towns, a car museum, and a long lunch. Dog stays drier in towns than on cliffs.'
      : mood==='hot' ? 'Heat plan: coast or shaded river valleys before 12:00, then a village terrace after 18:00. Check pavement temperature for paws.'
      : 'Good conditions. Spend it outdoors — viewpoints, coastal walks and villages first, indoor things later in the week.';
    return {title:'Weather', sub:`${esc(Store.here().name)} · ${esc(w.source)}`, body:`
      <div class="card"><div class="row" style="gap:12px">
        <span style="font-size:42px">${Weather.icon(w.code)}</span>
        <div><div style="font-family:var(--display);font-size:32px;font-weight:700">${w.temp}°C</div>
        <div class="sm t2">${esc(Weather.desc(w.code))} · feels ${w.feels}°</div></div>
        <div class="grow"></div>
        <div class="sm t2" style="text-align:right">${w.rain}% rain<br>${w.wind} km/h</div>
      </div></div>
      <div class="sect"><h3>Next 12 hours</h3>
        <div class="hscroll" style="margin-top:10px">${w.hourly.map(h=>`
          <div class="card" style="width:64px;text-align:center;padding:10px 6px">
            <div class="sm mut">${pad(h.h)}</div>
            <div style="font-family:var(--display);font-weight:700;margin:4px 0">${h.t}°</div>
            <div class="xs ${h.r>50?'':'mut'}">${h.r}%</div></div>`).join('')}</div></div>
      <div class="sect"><h3>Next days</h3>
        <div class="stack" style="margin-top:10px">${w.daily.map((d,i)=>{
          const dt=new Date(); dt.setDate(dt.getDate()+i);
          return `<div class="card between"><div class="row" style="gap:10px"><span style="font-size:20px">${Weather.icon(d.code)}</span>
            <strong>${i===0?'Today':dt.toLocaleDateString([], {weekday:'long'})}</strong></div>
            <div class="sm t2">${d.lo}° / <strong>${d.hi}°</strong>${d.r!=null?` · ${d.r}%`:''}</div></div>`;}).join('')}</div></div>
      <div class="verdict" style="margin-top:16px">${advice}</div>
      <button class="btn block ghost" style="margin-top:14px" data-wrefresh>Refresh</button>`};
  },

  /* ---- events radar ---- */
  events(){
    const list=Events.near(Views.eventRadius,Views.eventWhen);
    return {title:'Events radar', sub:'Spontaneous detours only — no ticketed tourist machinery', body:`
      <div class="seg" style="margin-bottom:10px">${[['today','Today'],['tomorrow','Tomorrow'],['week','This week']]
        .map(([k,l])=>`<button data-ewhen="${k}" class="${Views.eventWhen===k?'on':''}">${l}</button>`).join('')}</div>
      <div class="chiprow" style="margin-bottom:14px">${[10,25,50,100].map(r=>
        `<button class="chip ${Views.eventRadius===r?'on':''}" data-erad="${r}">${r} km</button>`).join('')}</div>
      <div class="stack">${list.length?list.map(e=>`
        <div class="card"><div class="between"><h3>${Events.kindEmoji(e.kind)} ${esc(e.name)}</h3><span class="pill">${e.km} km</span></div>
          <div class="sm mut" style="margin-top:4px">${new Date(e.date).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})} · ${e.time} · ${esc(e.cost)}</div>
          <div class="sm t2" style="margin-top:7px">${esc(e.why)}</div>
          <div class="row" style="gap:6px;margin-top:9px">
            <span class="pill">${mins2h(e.min)} drive</span>${e.dogFriendly?'<span class="pill good">🐕 fine</span>':'<span class="pill bad">🐕 no</span>'}
            <button class="pill" data-emap="${e.id}">Show on map</button></div></div>`).join(''):
        `<div class="empty"><span class="em">📻</span>Quiet within ${Views.eventRadius} km. Widen the radius or look at the week.</div>`}</div>
      <div class="sm mut" style="margin-top:14px">Demo event data. Connect a live source in Settings → Data sources.</div>`};
  },

  /* ---- food hunter ---- */
  food(id){
    if(id&&FOODS.some(f=>f.id===id)){
      const f=FOODS.find(x=>x.id===id), got=Store.s.foodLog.some(x=>x.foodId===id);
      return {title:`${f.emoji} ${esc(f.name)}`, sub:esc(REGIONS[f.region].name), body:`
        <p class="t2">${esc(f.what)}</p>
        <div class="score" style="margin-top:12px">
          <div><div class="k">Price</div><div class="v">${esc(f.priceRange)}</div></div>
          <div><div class="k">Travels in a car</div><div class="v">${f.travelsWell?'Yes':'Eat it there'}</div></div>
          <div><div class="k">Souvenir</div><div class="v">${f.goodSouvenir?'Worth taking home':'No'}</div></div>
          <div><div class="k">Region</div><div class="v">${REGIONS[f.region].flag} ${esc(REGIONS[f.region].country)}</div></div>
        </div>
        <div class="sect"><h3>Why it is from here</h3><p class="t2">${esc(f.why)}</p></div>
        <div class="sect"><h3>How locals have it</h3><p class="t2">${esc(f.how)}</p></div>
        <div class="sect"><h3>Where to look</h3><p class="t2">${esc(f.whereToLook)}</p></div>
        <button class="btn ${got?'':'primary'} block" style="margin-top:16px" data-bought="${f.id}">${got?'Already in your trip diary ✓':'Bought it'}</button>`};
    }
    const region=Store.region();
    const here=FOODS.filter(f=>f.region===region), rest=FOODS.filter(f=>f.region!==region);
    const row=f=>`<button class="hcard" data-food="${f.id}">
      <div class="th"><div class="gl" style="${UI.grad('product',f.id)}"></div><span class="em" style="position:relative">${f.emoji}</span></div>
      <div class="bd"><div class="between"><h3 class="ell">${esc(f.name)}</h3>${Store.s.foodLog.some(x=>x.foodId===f.id)?'<span class="pill good">Bought</span>':''}</div>
      <div class="sm mut ell">${esc(f.priceRange)} · ${f.travelsWell?'travels well':'eat it there'}</div>
      <div class="sm t2 ell" style="margin-top:5px">${esc(f.what)}</div></div></button>`;
    return {title:'Food hunter', sub:`What to eat and buy around ${esc(REGIONS[region].name)}`, body:`
      <button class="btn block" data-sheet="scanner" style="margin-bottom:14px">📷 Identify something in a shop</button>
      <h3>In this region</h3><div class="stack" style="margin:10px 0 18px">${here.map(row).join('')||'<div class="card mut sm">Nothing logged for this region yet.</div>'}</div>
      <h3>Elsewhere on the route</h3><div class="stack" style="margin-top:10px">${rest.map(row).join('')}</div>`};
  },

  /* ---- scanner (camera-ready, mock analysis) ---- */
  scanner(){
    return {title:'Identify a product', sub:'Photograph a cheese, bottle, tin or menu', body:`
      <div class="card" style="text-align:center;padding:22px">
        <div style="font-size:40px">📷</div>
        <p class="t2" style="margin-top:8px">Take a photo and the app tells you what it is, whether it is local, how to eat it and whether the price is fair.</p>
        <input type="file" accept="image/*" capture="environment" id="scan-file" style="margin-top:12px">
        <div id="scan-out" style="margin-top:14px"></div>
      </div>
      <div class="banner" style="margin-top:14px">No vision provider configured, so this runs in demo mode and returns a worked example. Add a provider in Settings → Data sources and the same screen starts using it.</div>
      ${Store.s.scans.length?`<div class="sect"><h3>Earlier scans</h3><div class="stack" style="margin-top:10px">${Store.s.scans.slice(0,8).map(s=>
        `<div class="card"><strong>${esc(s.guess)}</strong><div class="sm mut">${s.date}</div></div>`).join('')}</div></div>`:''}`,
      after(sheet){
        $('#scan-file',sheet)?.addEventListener('change',e=>{
          const f=e.target.files?.[0]; if(!f) return;
          const out=$('#scan-out',sheet); out.innerHTML='<div class="sm mut">Looking at it…</div>';
          setTimeout(()=>{
            const region=Store.region();
            const guess=FOODS.filter(x=>x.region===region)[Math.floor(Math.random()*Math.max(1,FOODS.filter(x=>x.region===region).length))]||FOODS[0];
            Store.s.scans.unshift({id:uid('scan'),guess:guess.name,date:todayISO()}); Store.save();
            out.innerHTML=`<div style="text-align:left">
              <div class="verdict">Looks like <strong>${esc(guess.name)}</strong>. ${esc(guess.why)}</div>
              <div class="score" style="margin-top:12px">
                <div><div class="k">Local here</div><div class="v">${guess.region===region?'Yes':'Imported to this region'}</div></div>
                <div><div class="k">Fair price</div><div class="v">${esc(guess.priceRange)}</div></div>
                <div><div class="k">How to eat</div><div class="v" style="font-size:12.5px;font-weight:500">${esc(guess.how)}</div></div>
                <div><div class="k">Worth buying</div><div class="v">${guess.goodSouvenir?'Yes, travels well':'Only to eat now'}</div></div></div>
              <div class="sm mut" style="margin-top:10px">Demo result — pattern matched to the region you are in, not to the photo.</div></div>`;
          },900);
        });
      }};
  },

  /* ---- parking ---- */
  parking(){
    const pk=Store.s.parking, here=Store.here();
    return {title:'Parking', sub:pk?'Saved spot':'Nothing saved yet', body:`
      ${pk?`<div class="card">
        <div class="between"><h3>🚗 Car parked here</h3><span class="pill">${Math.round(haversine(here,pk.coordinates)*1000)} m away</span></div>
        <div class="sm mut" style="margin-top:6px">Parked ${new Date(pk.at).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'})}</div>

        ${pk.note?`<div class="sm t2" style="margin-top:8px">📝 ${esc(pk.note)}</div>`:''}

      <div class="sect"><h3>${pk?'Park somewhere else':'Save where you parked'}</h3>
        <div class="stack" style="margin-top:10px">
          <div class="fld"><label>Note — level, street, landmark</label><input id="pk-note" placeholder="Level -2, blue zone, near lift B" value="${esc(pk?.note||'')}"></div>
          <div class="fld"><label>Paid until</label><input id="pk-exp" type="time" value="${esc(pk?.expires||'')}"></div>
          <div class="fld"><label>Photo of the sign</label><input id="pk-photo" type="file" accept="image/*" capture="environment"></div>
          <button class="btn primary block" data-parksave>Save this spot</button>
          <button class="btn block ghost" data-parktimer>Remind me before it expires</button>
        </div></div>
      <div class="banner" style="margin-top:14px">Photograph the sign now, read it later. Sign interpretation will be added to this screen when a vision provider is configured.</div>`,
      after(sheet){
        $('#pk-photo',sheet)?.addEventListener('change',e=>{
          const f=e.target.files?.[0]; if(!f) return; const r=new FileReader();
          r.onload=()=>{ Sheets._pendingPhoto=r.result; Shell.toast('Photo attached'); };
          r.readAsDataURL(f);
        });
      }};

  /* ---- scenic route ---- */
  route(){
    const bases=Store.s.trip.bases;
    return {title:'Plan a drive', sub:'Pick the character of the road, not just the fastest line', body:`
      <div class="stack" style="gap:12px">
        <div class="fld"><label>From</label><select id="rt-a">${bases.map(b=>`<option value="${b.id}" ${b.id===Store.s.activeBaseId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>To</label><select id="rt-b">${bases.map((b,i)=>`<option value="${b.id}" ${b.id===(Store.nextBase()?.id)?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>Character</label>
          <div class="row wrap" style="gap:7px">${['Fastest','Scenic','Coast','Mountains','Villages','Food stops']
            .map((k,i)=>`<button class="chip ${i===1?'on':''}" data-rtstyle="${k.toLowerCase()}" style="min-height:36px;padding:7px 12px">${k}</button>`).join('')}</div></div>
        <div class="fld"><label>Extra time you will accept</label>
          <div class="seg">${[['15','+15 min'],['30','+30 min'],['60','+60 min'],['999','No limit']].map(([v,l],i)=>

  },

  /* ---- base editor ---- */
  base(id){
    const b=Store.s.trip.bases.find(x=>x.id===id)||{id:uid('b'),name:'',region:Store.region(),coordinates:REGIONS[Store.region()].c,arrival:todayISO(),departure:todayISO(),accommodation:'',notes:'',parking:''};

    return {title:isNew?'New base':esc(b.name), sub:isNew?'':esc(REGIONS[b.region].name), body:`
      <div class="stack" style="gap:12px">
        <div class="fld"><label>Name</label><input id="bs-name" value="${esc(b.name)}" placeholder="Where are you staying?"></div>
        <div class="fld"><label>Coordinates</label>
          <input id="bs-ll" value="${b.coordinates?b.coordinates.lat.toFixed(5)+', '+b.coordinates.lng.toFixed(5):''}" placeholder="Paste, or look it up">
          <div class="row" style="gap:8px;margin-top:8px"><button class="btn sm" data-bsgeo>Look up by name</button>
            <span class="sm mut" id="bs-geostat">${isNew?'Set this so distances are right':'From '+(b.source==='user'?'your entry':'the demo trip')}</span></div></div>
        <div class="fld"><label>Region</label><select id="bs-region">${Object.entries(REGIONS).map(([k,r])=>
          `<option value="${k}" ${k===b.region?'selected':''}>${r.flag} ${r.name}</option>`).join('')}</select></div>
        <div class="row" style="gap:10px">
          <div class="fld grow"><label>Arrive</label><input id="bs-a" type="date" value="${b.arrival}"></div>
          <div class="fld grow"><label>Leave</label><input id="bs-d" type="date" value="${b.departure}"></div></div>
        <div class="fld"><label>Accommodation</label><input id="bs-acc" value="${esc(b.accommodation||'')}"></div>
        <div class="fld"><label>Parking</label><input id="bs-park" value="${esc(b.parking||'')}"></div>
        <div class="fld"><label>Notes</label><textarea id="bs-notes" rows="3">${esc(b.notes||'')}</textarea></div>

      </div>
      ${nearby.length?`<div class="sect"><h3>Within 40 minutes</h3><div class="stack" style="margin-top:10px">${nearby.map(p=>UI.placeRow(p)).join('')}</div></div>`:''}`};

  /* ---- AI assistant ---- */
  ask(){

      <div class="row wrap" style="gap:7px;margin-bottom:12px">${[

      ].map(q=>`<button class="chip" data-askq="${esc(q)}" style="min-height:36px;padding:7px 12px">${esc(q)}</button>`).join('')}</div>
      <div class="fld"><textarea id="ai-q" rows="3" placeholder="We're in San Sebastián, it's 12:00, we've done the old town, dog is with us, weather is good…"></textarea></div>

  /* ---- search anywhere ---- */
  find(arg){
    const q=arg&&arg.q||'';
    return {title:'Find a place', sub:'Searches OpenStreetMap. Pasted coordinates work offline.', body:`
      <div class="row" style="gap:8px">
        <input id="gc-q" class="grow" placeholder="Village, beach, café — or 43.3183, -1.9812" value="${esc(q)}" autocomplete="off">
        <button class="btn" data-gcsearch>Search</button>
      </div>
      ${arg&&arg.intent==='save'?'<div class="banner" style="margin-top:12px">Find the spot, then save it as a place. Coordinates pasted from any map app work too.</div>':''}
      <div id="gc-out" style="margin-top:14px">

  /* ---- add or edit a place of your own ---- */
  newplace(arg){
    const edit=arg&&arg.editId?getPlace(arg.editId):null;
    const d=edit?{name:edit.name,lat:edit.coordinates.lat,lng:edit.coordinates.lng,detail:edit.address,
        category:edit.category,cost:edit.costEstimate,park:edit.parkingDifficulty,dog:edit.dogStatus,
        why:edit.why,hours:edit.openingHours,visit:edit.visitDuration}:(arg||{});
    const cat=d.category||'detour';
    const visits=[[30,60],[45,90],[60,120],[90,150],[120,240],[180,300]];
    const vsel=(d.visit||[60,120]).join('-');
    return {title:edit?'Edit place':'Save this place', sub:d.detail?esc(d.detail):'Stored on this phone with its real coordinates', body:`
      <div class="stack" style="gap:12px">
        <div class="fld"><label>Name</label><input id="np-name" value="${esc(d.name||'')}" placeholder="What do you call it?"></div>
        <div class="fld"><label>Coordinates — paste from any map app</label>
          <input id="np-ll" value="${d.lat!=null?(+d.lat).toFixed(5)+', '+(+d.lng).toFixed(5):''}" placeholder="43.31830, -1.98120">
          <div class="row" style="gap:8px;margin-top:8px">
            <button class="btn sm" data-npgeo>Look it up by name</button>
            ${Geo.live?'<button class="btn sm" data-npgps>Use my position</button>':''}
          </div></div>
        <div class="fld"><label>What kind of place</label>
          <div class="row wrap" style="gap:7px">${Object.entries(CATS).map(([k,c])=>
            `<button class="chip ${k===cat?'on':''}" data-npcat="${k}" style="min-height:36px;padding:7px 12px">${c.e} ${c.n}</button>`).join('')}</div></div>
        <div class="fld"><label>How long to allow</label>
          <select id="np-visit">${visits.map(v=>`<option value="${v.join('-')}" ${v.join('-')===vsel?'selected':''}>${v[0]}–${v[1]} min</option>`).join('')}</select></div>
        <div class="row" style="gap:10px">
          <div class="fld grow"><label>Cost each, €</label><input id="np-cost" type="number" min="0" step="1" value="${d.cost!=null?d.cost:0}"></div>
          <div class="fld grow"><label>Parking</label><select id="np-park">${Object.entries(PARK).map(([k,v])=>
            `<option value="${k}" ${k===(d.park||'moderate')?'selected':''}>${v.l}</option>`).join('')}</select></div>
        </div>
        <div class="fld"><label>Dogs</label><select id="np-dog">${Object.entries(DOG).map(([k,v])=>
          `<option value="${k}" ${k===(d.dog||'leash')?'selected':''}>${v.l}</option>`).join('')}</select></div>
        <div class="fld"><label>Opening hours, if you know them</label><input id="np-hours" value="${esc(d.hours||'')}" placeholder="Tue–Sat 10:00–13:30"></div>
        <div class="fld"><label>Why it is worth it</label><textarea id="np-why" rows="3" placeholder="Practical notes: parking, shade, what to order…">${esc(d.why&&d.why.startsWith('Your own find')?'':d.why||'')}</textarea></div>
        <button class="btn primary block" data-npsave="${edit?edit.id:''}">${edit?'Save changes':'Add to my places'}</button>
        ${edit?`<button class="btn block ghost" data-delplace="${edit.id}">Delete this place</button>`:''}
      </div>`};
  },

  /* ---- wrapping up a day ---- */
  dayend(){
    const act=Today.active;
    if(!act) return {title:'Nothing running', body:'<div class="empty">No day in progress. Start one from the home screen.</div>'};
    const {a,plan}=act, st=Today.status();
    const doneIds=Object.entries(a.state).filter(([i,v])=>v==='done')
      .map(([i])=>plan.stops[i]&&plan.stops[i].placeId).filter(Boolean);
    const foods=Store.s.foodLog.filter(f=>f.date===a.date).map(f=>FOODS.find(x=>x.id===f.foodId)).filter(Boolean);
    const hours=Math.round((Date.now()-a.startedAt)/36e5*10)/10;
    return {title:esc(plan.title), sub:`${st.done} stops · ${hours}h out · ${mins2h(plan.driveMin)} driving`, body:`
      ${doneIds.length?`<h3>How were they?</h3>
        <div class="stack" style="margin:10px 0 4px">${doneIds.map(id=>{
          const p=getPlace(id), v=Store.visit(id);
          return `<div class="card"><strong>${esc(p.name)}</strong>
            <div class="row" style="gap:6px;margin-top:9px">${['loved','good','okay','skip'].map(r=>
              `<button class="btn sm grow ${v&&v.rating===r?'primary':''}" data-rate="${id}:${r}">${({loved:'Loved',good:'Good',okay:'Okay',skip:'Skip next time'})[r]}</button>`).join('')}</div></div>`;
        }).join('')}</div>`:'<div class="banner">No stops completed. Ending now just clears the day.</div>'}
      ${st.skipped?`<div class="sm mut" style="margin-top:10px">${st.skipped} stop${st.skipped===1?'':'s'} skipped — they stay in Saved for another day.</div>`:''}
      ${foods.length?`<div class="sect"><h3>Bought today</h3>
        <div class="row wrap" style="gap:8px;margin-top:10px">${foods.map(f=>`<span class="pill">${f.emoji} ${esc(f.name)}</span>`).join('')}</div></div>`:''}
      <div class="stack" style="margin-top:18px">
        <button class="btn primary block" data-tdfinish>Save the day to my diary</button>
        <button class="btn block ghost" data-close>Keep going</button>
      </div>`};
  },

  /* ---- settings ---- */
  settings(){
    const p=Store.s.prefs;
    const likeTags=['scenic','food','product','village','city','view','nature','market','hike','festival','motorsport','history','beach'];
    return {title:'Settings', sub:'Travel profile, stored on this phone only', body:`
      <div class="card between"><div><strong>🐕 Dog Mode</strong><div class="sm mut">Hides places where dogs are banned</div></div>
        <button class="sw ${p.dogMode?'on':''}" data-dogmode></button></div>
      <div class="card between" style="margin-top:10px"><div><strong>Dark theme</strong><div class="sm mut">Easier at night, lighter on battery</div></div>
        <button class="sw ${p.theme==='dark'?'on':''}" data-theme></button></div>

      <div class="sect"><h3>Where you are</h3>
        <div class="stack" style="margin-top:10px">
          <div class="fld"><label>Current base</label><select id="st-base">${Store.s.trip.bases.map(b=>
            `<option value="${b.id}" ${b.id===Store.s.activeBaseId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
          <div class="between card"><div class="sm">${Geo.status==='ok'?'Using live GPS position':Geo.status==='denied'?'Location permission denied — using your base':'GPS not in use'}</div>
            <button class="btn sm" data-geo>${Geo.status==='ok'?'Refresh':'Use GPS'}</button></div>
          <button class="btn block" data-sheet="find">Search for where you are</button>
          ${Store.s.manualLocation?`<div class="between card"><div class="sm">Location set manually to <strong>${esc(Store.s.manualLocation.name)}</strong></div>
            <button class="btn sm" data-clearloc>Clear</button></div>`:''}
        </div></div>

      <div class="sect"><h3>Travel profile</h3>
        <div class="sm mut" style="margin:6px 0 10px">Set once. The planner and Explore use it and stop asking.</div>
        <div class="row wrap" style="gap:7px">${likeTags.map(t=>
          `<button class="chip ${p.likes.includes(t)?'on':''}" data-like="${t}" style="min-height:36px;padding:7px 12px">${t}</button>`).join('')}</div>
        <div class="stack" style="margin-top:12px">
          <div class="fld"><label>Usual pace</label><div class="seg">${['relaxed','normal','busy'].map(i=>
            `<button data-pace="${i}" class="${p.intensity===i?'on':''}">${i[0].toUpperCase()+i.slice(1)}</button>`).join('')}</div></div>
          <div class="row" style="gap:10px">
            <div class="fld grow"><label>Usual start</label><input id="st-start" type="time" value="${p.startTime}"></div>
            <div class="fld grow"><label>Usual return</label><input id="st-end" type="time" value="${p.returnTime}"></div></div>
          <div class="fld"><label>Comfortable driving, one way</label><select id="st-drive">${[30,45,60,90,120,180].map(m=>
            `<option value="${m}" ${m===p.maxDriveMin?'selected':''}>${mins2h(m)}</option>`).join('')}</select></div>
          <div class="between card"><div><strong>Avoid the crowds</strong><div class="sm mut">Down-ranks the very touristy stops</div></div>
            <button class="sw ${p.avoidCrowds?'on':''}" data-crowds></button></div>
        </div></div>

      <div class="sect"><h3>Data sources</h3>
        <div class="stack" style="margin-top:10px">
          ${[['weather','Weather','Open-Meteo, no key needed',true],
             ['tiles','Map tiles','OpenStreetMap raster',true],
             ['search','Place search','Nominatim · '+Geocode.cached+' lookups cached',true],
             ['events','Events','Demo data',false],
             ['routing','Routing','OpenRouteService — needs a key',!!Config.keyFor('routing')],
             ['ai','AI assistant','Built-in rule engine',!!Config.keyFor('ai')],
             ['vision','Product scanner','Demo mode',!!Config.keyFor('vision')]]
            .map(([k,n,d,on])=>`<div class="card between"><div><strong>${n}</strong><div class="sm mut">${d}</div></div>
              <span class="pill ${on?'good':''}">${on?'Live':'Demo'}</span></div>`).join('')}
          <div class="fld"><label>Routing key (OpenRouteService)</label><input id="st-key-routing" value="${esc(Config.keyFor('routing')||'')}" placeholder="Paste key — stored on this device only"></div>
          <div class="fld"><label>AI endpoint</label><input id="st-key-ai" value="${esc(Config.keyFor('ai')||'')}" placeholder="https://your-proxy/ask"></div>
          <button class="btn block" data-keysave>Save keys</button>
          <div class="sm mut">Keys live in this browser only and are never written into the app code.</div>
        </div></div>

      <div class="sect"><h3>Storage</h3>
        <div class="stack" style="margin-top:10px">
          <div class="card"><div class="between"><span class="sm">Saved places</span><strong>${Store.s.saved.length}</strong></div>
            <div class="between"><span class="sm">Places you added</span><strong>${Store.s.userPlaces.length}</strong></div>
            <div class="between"><span class="sm">Visited</span><strong>${Store.s.visited.length}</strong></div>
            <div class="between"><span class="sm">Day plans kept</span><strong>${Store.s.plans.length}</strong></div>
            <div class="between"><span class="sm">Food logged</span><strong>${Store.s.foodLog.length}</strong></div></div>
          <button class="btn block" data-export>Export everything as JSON</button>
          <button class="btn block ghost" data-reset>Reset the app</button>
        </div></div>
      <div class="sm mut" style="margin-top:18px">Roadtrip Companion · offline-first · demo dataset for southern France, northern Spain and Portugal.</div>`};
  }
};

function geoResultsHtml(list,q){
  if(!list.length) return `<div class="empty"><span class="em">🔍</span>Nothing found for “${esc(q)}”.
    Add the region — “Getaria Spain” — or paste coordinates.</div>`;
  Sheets._geo=list;
  return `<div class="stack">${list.map((r,i)=>{
    const m=driveMin(Store.here(),{lat:r.lat,lng:r.lng});
    const tag=r.source==='offline'?'from your offline data':r.source==='coordinates'?'pasted coordinates':r.cached?'cached earlier':'OpenStreetMap';
    return `<div class="card">
      <div class="between"><h3 class="ell">${esc(r.name)}</h3><span class="pill">${mins2h(m)} away</span></div>
      ${r.detail?`<div class="sm mut" style="margin-top:3px">${esc(r.detail)}</div>`:''}
      <div class="xs mut" style="margin-top:5px">${r.lat.toFixed(4)}, ${r.lng.toFixed(4)} · ${esc(r.kind||'place')} · ${tag}</div>
      <div class="row wrap" style="gap:6px;margin-top:10px">
        ${r.placeId?`<button class="pill" data-place="${r.placeId}">Open</button>`
                   :`<button class="pill warn" data-gcpick="${i}:save">Save as a place</button>`}
        ${r.baseId?`<button class="pill" data-bsactive="${r.baseId}">Make this my base</button>`
                  :`<button class="pill" data-gcpick="${i}:here">We are here now</button>`}
        <button class="pill" data-gcpick="${i}:map">Map</button>
      </div></div>`;}).join('')}</div>`;
}

/* =====================================================================
   8. SHELL — routing, actions, install, service worker
   ===================================================================== */
const Shell={
  offline:!navigator.onLine, installPrompt:null, _t:null,
  toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('in');
    clearTimeout(this._t); this._t=setTimeout(()=>t.classList.remove('in'),2200); },
  go(tab){ Views.tab=tab; Views.render(); window.scrollTo({top:0}); },
  afterRender(){
    if(Views.tab==='home'&&this.installPrompt&&!localStorage.getItem('rtc.installed')){
      const b=el(`<div class="banner" style="margin:0 0 12px"><div class="grow">Install it on the home screen so it works without signal.</div>
        <button class="btn sm primary" data-install>Install</button></div>`);
      $('#view').prepend(b);
    }
  },
  async install(){
    if(!this.installPrompt) return this.toast('Use your browser menu → Add to home screen');
    this.installPrompt.prompt(); const r=await this.installPrompt.userChoice;
    if(r.outcome==='accepted'){ localStorage.setItem('rtc.installed','1'); this.toast('Installed'); }
    this.installPrompt=null; Views.render();
  },
  theme(){ document.documentElement.setAttribute('data-theme',Store.s.prefs.theme);
    $('meta[name=theme-color]').setAttribute('content',Store.s.prefs.theme==='dark'?'#101317':'#F2F1EC'); }
};
const _origRender=Views.render.bind(Views);
Views.render=function(){ _origRender(); Shell.afterRender&&Shell.afterRender(); };

/* ---------- one delegated click handler ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-dogmode],[data-sheet],[data-geo],[data-regen],[data-quick],[data-place],[data-event],[data-food],[data-swap],[data-startday],[data-planroute],[data-nudge],[data-ecat],[data-efil],[data-stab],[data-base],[data-addbase],[data-export],[data-close],[data-save],[data-showmap],[data-rate],[data-unvisit],[data-mapz],[data-maphere],[data-mfil],[data-mk],[data-mcl],[data-pace],[data-ptag],[data-ptheme],[data-plgen],[data-wrefresh],[data-ewhen],[data-erad],[data-emap],[data-bought],[data-parksave],[data-parkclear],[data-parkmap],[data-parktimer],[data-rtstyle],[data-rtextra],[data-rtgo],[data-bssave],[data-bsactive],[data-bsdel],[data-askq],[data-askgo],[data-like],[data-theme],[data-crowds],[data-keysave],[data-reset],[data-install],[data-plan],[data-gcsearch],[data-gcpick],[data-npcat],[data-npgeo],[data-npgps],[data-npsave],[data-editplace],[data-delplace],[data-bsgeo],[data-clearloc],[data-rtmap],[data-tdstart],[data-tdcancel],[data-tdarrive],[data-tddone],[data-tdskip],[data-tdlinger],[data-tddrop],[data-tdend],[data-tdfinish],[data-showopts]');
  if(!t) return;
  const d=t.dataset, S=Store.s;

  /* navigation & global */
  if(d.tab){ Sheets.close(); Shell.go(d.tab); return; }
  if(d.close!==undefined){ Sheets.close(); return; }
  if(d.install!==undefined){ Shell.install(); return; }
  if(d.sheet){ Sheets.open(d.sheet); return; }
  if(d.dogmode!==undefined){ S.prefs.dogMode=!S.prefs.dogMode; Store.save(); Views.plans=[];
    Shell.toast(S.prefs.dogMode?'Dog Mode on — dog-friendly first':'Dog Mode off');
    Views.render(); if(Sheets._cur) Sheets.refresh(); return; }
  if(d.theme!==undefined){ S.prefs.theme=S.prefs.theme==='dark'?'light':'dark'; Store.save(); Shell.theme(); Sheets.refresh(); Views.render(); return; }
  if(d.crowds!==undefined){ S.prefs.avoidCrowds=!S.prefs.avoidCrowds; Store.save(); Views.plans=[]; Sheets.refresh(); return; }
  if(d.geo!==undefined){ await Geo.ask();
    if(Geo.status!=='ok') Shell.toast('Location unavailable — pick your base in Settings'); else Shell.toast('Using your live position');
    Views.plans=[]; Views.render(); if(Sheets._cur) Sheets.refresh(); return; }

  /* home */
  if(d.regen!==undefined){ Views.regenPlans(); Shell.toast('Three new days'); Views.render(); return; }
  if(d.quick){
    const q=d.quick;
    if(q==='ask') return Sheets.open('ask');
    if(q==='parking') return Sheets.open('parking');
    if(q==='events') return Sheets.open('events');
    if(q==='tomorrow'){ Sheets.open('planner'); return; }
    if(q==='savehere'){
      if(Geo.live){
        Shell.toast('Naming this spot…');
        const r=await Geocode.reverse(Geo.live.lat,Geo.live.lng);
        Sheets.open('newplace',{name:r?r.name:'Here',detail:r?r.detail:'From your GPS position',
          lat:Geo.live.lat,lng:Geo.live.lng});
      } else if(Store.s.manualLocation){
        const m=Store.s.manualLocation;
        Sheets.open('newplace',{name:m.name,detail:'Your set location',lat:m.lat,lng:m.lng});
      } else Sheets.open('find',{intent:'save'});
      return;
    }
    const map={food:['food','market','product'],view:['view'],dog:['dog']}[q]||[];
    const plan=Planner.build(q==='dog'?'relaxed':'explore',{prefs:map});
    if(plan){ Store.savePlan(plan); Sheets.open('plan',plan.id); } else Shell.toast('Nothing matches — try raising the driving limit');
    return;
  }

  /* places / events / food */
  if(d.place){ Sheets.open('place',d.place); return; }
  if(d.plan){ Sheets.open('plan',d.plan); return; }
  if(d.event||d.emap){
    const e=EVENTS.find(x=>x.id===(d.event||d.emap));
    if(!e) return;
    if(d.emap){ Sheets.close(); MapView.goto(e.coordinates,11); return; }
    Shell.toast(`${e.name} · ${e.time} · ${driveKm(Store.here(),e.coordinates)} km`); return;
  }
  if(d.food){ Sheets.close(); setTimeout(()=>Sheets.open('food',d.food),20); return; }
  if(d.bought){ Store.boughtFood(d.bought); Shell.toast('Added to the trip diary'); Sheets.refresh(); return; }

  /* plan actions */
  if(d.swap){ const [pid,idx]=d.swap.split(':');
    const plan=Views.plans.find(p=>p.id===pid)||S.plans.find(p=>p.id===pid);
    if(plan){ Planner.replaceStop(plan,+idx); Store.savePlan(plan); Shell.toast('Stop replaced'); Views.render(); if(Sheets._cur) Sheets.refresh(); }
    return; }
  if(d.nudge){ const [pid,kind]=d.nudge.split(':');
    const i=Views.plans.findIndex(p=>p.id===pid);
    const plan=i>=0?Views.plans[i]:S.plans.find(p=>p.id===pid);
    if(plan){ const np=Planner.nudge(plan,kind); np.tag=plan.tag; if(i>=0) Views.plans[i]=np; Store.savePlan(np);
      Shell.toast({'less-driving':'Tightened up the driving',food:'More food',nature:'More nature',towns:'More towns',relax:'Slowed it down'}[kind]);
      Views.render(); }
    return; }
  if(d.startday){ const plan=Views.plans.find(p=>p.id===d.startday)||S.plans.find(p=>p.id===d.startday);
    if(plan){
      plan.stops.filter(s=>s.placeId).forEach(s=>{ if(!Store.isSaved(s.placeId)) Store.toggleSave(s.placeId); });
      Today.start(plan); Views.showOptions=false;
      Shell.toast(plan.date>todayISO()?'Saved for '+new Date(plan.date).toLocaleDateString([], {weekday:'long'}):'Day started — stops kept offline');
      Sheets.close(); Shell.go('home'); }
    return; }

  /* the live day */
  if(d.showopts!==undefined){ Views.showOptions=true; Views.render(); return; }
  if(d.tdstart!==undefined){ const act=Today.active;
    if(act){ act.a.date=todayISO(); act.plan.date=todayISO(); act.a.startedAt=Date.now(); Today.retime(); Store.save(); }
    Shell.toast('Day started'); Views.render(); return; }
  if(d.tdcancel!==undefined){ Today.cancel(); Shell.toast('Cleared'); Views.render(); return; }
  if(d.tdarrive!==undefined){ Today.arrive(); Views.render(); return; }
  if(d.tddone!==undefined){ const s=Today.done();
    Shell.toast(s&&s.placeId?`${getPlace(s.placeId).name} added to your diary`:'Done');
    Views.render(); return; }
  if(d.tdskip!==undefined){ Today.skip(); Shell.toast('Skipped — still in Saved'); Views.render(); return; }
  if(d.tdlinger){ Today.linger(+d.tdlinger); Shell.toast('Thirty more minutes here'); Views.render(); return; }
  if(d.tddrop!==undefined){ Today.dropLast(); Shell.toast('Dropped the last stop'); Views.render(); return; }
  if(d.tdend!==undefined){ Sheets.open('dayend'); return; }
  if(d.tdfinish!==undefined){ const e=Today.finish();
    Sheets.close(); Views.savedTab='timeline';
    Shell.toast(e?`Day saved — ${e.done} stop${e.done===1?'':'s'}`:'Cleared');
    Shell.go('home'); return; }
  if(d.planroute){ const plan=Views.plans.find(p=>p.id===d.planroute)||S.plans.find(p=>p.id===d.planroute);
    if(plan){ Sheets.close(); MapView.fit(plan.stops.filter(s=>s.placeId).map(s=>getPlace(s.placeId).coordinates).concat([Store.here()])); }
    return; }

  /* explore */
  if(d.ecat){ Views.exploreCat=d.ecat; Views.render(); return; }
  if(d.efil){ Views.exploreFilters.has(d.efil)?Views.exploreFilters.delete(d.efil):Views.exploreFilters.add(d.efil); Views.render(); return; }
  if(d.stab){ Views.savedTab=d.stab; Views.render(); return; }

  /* saving / rating */
  if(d.save){ const added=Store.toggleSave(d.save); Shell.toast(added?'Saved — available offline':'Removed'); Sheets.refresh(); Views.render(); return; }
  if(d.rate){ const [id,r]=d.rate.split(':'); Store.markVisited(id,r); Shell.toast('Added to your diary'); Sheets.refresh(); Views.render(); return; }
  if(d.unvisit){ Store.unvisit(d.unvisit); Sheets.refresh(); Views.render(); return; }
  if(d.showmap){ const p=getPlace(d.showmap); Sheets.close(); MapView.goto(p.coordinates,12); return; }

  /* map */
  if(d.mapz){ MapView.zoomBy(+d.mapz); return; }
  if(d.maphere){ MapView.goto(Store.here(),11); return; }
  if(d.mfil){ MapView.setFilter(d.mfil); return; }
  if(d.mcl){ const pts=d.mcl.split('|').map(s=>{const [lat,lng]=s.split(',').map(Number);return {lat,lng};}); MapView.fit(pts); return; }
  if(d.mk){ const [type,id]=d.mk.split(':');
    if(type==='place') Sheets.open('place',id);
    else if(type==='event'){ const e=EVENTS.find(x=>x.id===id); Shell.toast(`${e.name} · ${e.time}`); }
    else if(type==='base') Sheets.open('base',id);
    else if(type==='parking') Sheets.open('parking');
    return; }

  /* planner sheet */
  if(d.pace){ S.prefs.intensity=d.pace; Store.save();
    t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(d.ptag){ t.classList.toggle('on'); return; }
  if(d.ptheme){ t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(d.plgen!==undefined){
    const sheet=t.closest('.sheet');
    const baseId=$('#pl-from',sheet).value, b=S.trip.bases.find(x=>x.id===baseId);
    const theme=sheet.querySelector('[data-ptheme].on')?.dataset.ptheme||'explore';
    const prefs=[...sheet.querySelectorAll('[data-ptag].on')].map(x=>x.dataset.ptag);
    S.prefs.startTime=$('#pl-start',sheet).value; S.prefs.returnTime=$('#pl-end',sheet).value;
    S.prefs.maxDriveMin=+$('#pl-drive',sheet).value; Store.save();
    const plan=Planner.build(theme,{from:{name:b.name,...b.coordinates},start:S.prefs.startTime,end:S.prefs.returnTime,
      maxDriveMin:S.prefs.maxDriveMin,prefs,dog:S.prefs.dogMode});
    const out=$('#pl-out',sheet);
    if(!plan){ out.innerHTML='<div class="banner">Nothing fits those limits. Allow more driving time or drop a preference.</div>'; return; }
    Store.savePlan(plan);
    out.innerHTML=UI.planCard(plan);
    out.scrollIntoView({behavior:'smooth',block:'nearest'});
    return; }

  /* weather / events sheets */
  if(d.wrefresh!==undefined){ await Weather.refresh(true); Sheets.refresh(); return; }
  if(d.ewhen){ Views.eventWhen=d.ewhen; Sheets.refresh(); return; }
  if(d.erad){ Views.eventRadius=+d.erad; Sheets.refresh(); return; }

  /* parking */
  if(d.parksave!==undefined){
    const sheet=t.closest('.sheet'), here=Store.here();
    S.parking={id:uid('pk'),coordinates:{lat:here.lat,lng:here.lng},at:Date.now(),
      note:$('#pk-note',sheet).value,expires:$('#pk-exp',sheet).value||null,photo:Sheets._pendingPhoto||S.parking?.photo||null};
    Sheets._pendingPhoto=null; Store.save(); Shell.toast('Parking spot saved'); Sheets.refresh(); return; }
  if(d.parkclear!==undefined){ S.parking=null; Store.save(); Sheets.refresh(); return; }
  if(d.parkmap!==undefined){ if(S.parking){ Sheets.close(); MapView.goto(S.parking.coordinates,15);
    Shell.toast(`${Math.round(haversine(Store.here(),S.parking.coordinates)*1000)} m to the car`); } return; }
  if(d.parktimer!==undefined){
    const exp=S.parking?.expires; if(!exp) return Shell.toast('Set a “paid until” time first');
    const [h,m]=exp.split(':').map(Number); const now=new Date(); const target=new Date();
    target.setHours(h,m-10,0,0); if(target<now) target.setDate(target.getDate()+1);
    const ms=target-now;
    if('Notification' in window && Notification.permission!=='granted') await Notification.requestPermission();
    setTimeout(()=>{ try{ new Notification('Parking expires in 10 minutes',{body:S.parking?.note||'Move the car'}); }
      catch(e){ Shell.toast('Parking expires in 10 minutes'); } },Math.min(ms,2**31-1));
    Shell.toast(`Reminder set for ${pad(target.getHours())}:${pad(target.getMinutes())}`); return; }

  /* scenic route */
  if(d.rtstyle||d.rtextra){ t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(d.rtgo!==undefined){
    const sheet=t.closest('.sheet');
    const a=S.trip.bases.find(x=>x.id===$('#rt-a',sheet).value), b=S.trip.bases.find(x=>x.id===$('#rt-b',sheet).value);
    const style=sheet.querySelector('[data-rtstyle].on')?.dataset.rtstyle||'scenic';
    const extra=+(sheet.querySelector('[data-rtextra].on')?.dataset.rtextra||30);
    const out=$('#rt-out',sheet);
    if(!a||!b||a.id===b.id){ out.innerHTML='<div class="banner">Pick two different places.</div>'; return; }
    const direct=driveMin(a.coordinates,b.coordinates);
    const want={coast:['beach','view'],mountains:['nature','hike','view'],villages:['village'],
      'food stops':['food','market','product'],'food':['food','market','product'],scenic:['view','village','nature'],fastest:[]}[style]||[];
    let stops=[];
    if(want.length){
      stops=allPlaces().filter(p=>want.includes(p.category)||p.tags.some(x=>want.includes(x)))
        .map(p=>({p,det:driveMin(a.coordinates,p.coordinates)+driveMin(p.coordinates,b.coordinates)-direct}))
        .filter(x=>x.det<=extra+18).sort((x,y)=>x.det-y.det).slice(0,4)
        .sort((x,y)=>driveMin(a.coordinates,x.p.coordinates)-driveMin(a.coordinates,y.p.coordinates));
    }
    let total=direct, cur=a.coordinates;
    const legs=stops.map(({p})=>{ const m=driveMin(cur,p.coordinates); cur=p.coordinates; return {p,m}; });
    total=legs.reduce((s,l)=>s+l.m,0)+driveMin(cur,b.coordinates);
    const route={id:uid('rt'),from:a.name,to:b.name,style,directMin:direct,totalMin:total,stops:stops.map(s=>s.p.id)};
    S.routes.unshift(route); S.routes=S.routes.slice(0,10); Store.save();
    out.innerHTML=`
      <div class="card" style="margin-top:12px">
        <div class="between"><h3>${esc(a.name)} → ${esc(b.name)}</h3><span class="pill ${total-direct>extra?'warn':'good'}">+${mins2h(total-direct)}</span></div>
        <div class="sm mut" style="margin-top:4px">${mins2h(total)} total · direct is ${mins2h(direct)} · ${driveKm(a.coordinates,b.coordinates)} km as the road runs</div>
        <div class="tl" style="margin-top:12px">
          <div class="stop"><span class="t">start</span><span class="n">${esc(a.name)}</span></div>
          ${legs.map(l=>`<div class="stop"><span class="t">+${l.m}m</span><span class="n">${esc(l.p.name)}</span>
            <button class="pill" data-place="${l.p.id}">open</button></div>
            <div class="d" style="grid-column:2/4;margin:-7px 0 0">${esc(l.p.why.split('.')[0])}.</div>`).join('')}
          <div class="stop"><span class="t">end</span><span class="n">${esc(b.name)}</span></div>
        </div>
        <button class="btn sm" style="margin-top:12px" data-rtmap="${route.id}">Show the whole route</button>
      </div>${stops.length?'':'<div class="banner" style="margin-top:12px">Nothing worth the detour within that extra time. Try +60 min or a different character.</div>'}`;
    return; }
  if(d.rtmap){ const r=S.routes.find(x=>x.id===d.rtmap); if(!r) return;
    const pts=r.stops.map(id=>getPlace(id).coordinates)
      .concat([S.trip.bases.find(b=>b.name===r.from).coordinates,S.trip.bases.find(b=>b.name===r.to).coordinates]);
    Sheets.close(); MapView.fit(pts); return; }

  /* place search */
  if(d.gcsearch!==undefined){
    const sheet=t.closest('.sheet'), q=$('#gc-q',sheet).value.trim(), out=$('#gc-out',sheet);
    if(!q) return;
    out.innerHTML='<div class="sm mut">Searching…</div>';
    const list=await Geocode.search(q);
    out.innerHTML=geoResultsHtml(list,q);
    return; }
  if(d.gcpick){
    const [i,act]=d.gcpick.split(':'); const r=Sheets._geo?.[+i]; if(!r) return;
    if(act==='save'){ Sheets.close(); setTimeout(()=>Sheets.open('newplace',{name:r.name,detail:r.detail,lat:r.lat,lng:r.lng}),20); return; }
    if(act==='here'){
      S.manualLocation={name:r.name,lat:r.lat,lng:r.lng};
      Store.save(); Views.plans=[]; Weather.refresh(true);
      Shell.toast('Location set to '+r.name); Sheets.close(); Shell.go('home'); return; }
    if(act==='map'){ Sheets.close(); MapView.goto({lat:r.lat,lng:r.lng},13); return; }
    return; }
  if(d.clearloc!==undefined){ S.manualLocation=null; Store.save(); Views.plans=[]; Weather.refresh(true);
    Shell.toast('Back to your base'); Sheets.refresh(); Views.render(); return; }

  /* new / edited place of your own */
  if(d.npcat){ t.parentElement.querySelectorAll('[data-npcat]').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(d.npgps!==undefined){
    if(!Geo.live) return Shell.toast('No GPS position yet');
    const sheet=t.closest('.sheet');
    $('#np-ll',sheet).value=Geo.live.lat.toFixed(5)+', '+Geo.live.lng.toFixed(5);
    Shell.toast('Using your position'); return; }
  if(d.npgeo!==undefined){
    const sheet=t.closest('.sheet'), name=$('#np-name',sheet).value.trim();
    if(!name) return Shell.toast('Type a name first');
    Shell.toast('Looking it up…');
    const list=await Geocode.search(name);
    if(!list.length) return Shell.toast('Nothing found — try adding the region');
    $('#np-ll',sheet).value=list[0].lat.toFixed(5)+', '+list[0].lng.toFixed(5);
    Shell.toast('Found '+list[0].name+(list[0].detail?' — '+list[0].detail.split(',')[0]:'')); return; }
  if(d.npsave!==undefined){
    const sheet=t.closest('.sheet');
    const name=$('#np-name',sheet).value.trim();
    const ll=Geocode.parseCoords($('#np-ll',sheet).value);
    if(!name) return Shell.toast('Give it a name');
    if(!ll) return Shell.toast('Coordinates look wrong — use “43.31830, -1.98120”');
    const payload={ name, lat:ll.lat, lng:ll.lng,
      category:sheet.querySelector('[data-npcat].on')?.dataset.npcat||'detour',
      visit:$('#np-visit',sheet).value.split('-').map(Number),
      cost:+$('#np-cost',sheet).value||0,
      park:$('#np-park',sheet).value, dog:$('#np-dog',sheet).value,
      hours:$('#np-hours',sheet).value.trim()||null, why:$('#np-why',sheet).value.trim() };
    let p;
    if(d.npsave){ p=Places.update(d.npsave,{name:payload.name,coordinates:{lat:ll.lat,lng:ll.lng},
        category:payload.category,visitDuration:payload.visit,costEstimate:payload.cost,
        parkingDifficulty:payload.park,dogStatus:payload.dog,openingHours:payload.hours,
        why:payload.why||'Your own find.',region:Places.nearestRegion({lat:ll.lat,lng:ll.lng})});
      if(p) p.country=REGIONS[p.region].country;
      Shell.toast('Updated'); }
    else { p=Places.create(payload); Views.plans=[]; Shell.toast('Saved — it now counts in day plans'); }
    Sheets.close(); Views.render();
    if(p) setTimeout(()=>Sheets.open('place',p.id),30);
    return; }
  if(d.editplace){ const id=d.editplace; Sheets.close(); setTimeout(()=>Sheets.open('newplace',{editId:id}),20); return; }
  if(d.delplace){
    if(!confirm('Delete this place and its notes?')) return;
    Places.remove(d.delplace); Views.plans=[]; Sheets.close(); Shell.toast('Deleted'); Views.render(); return; }

  /* trip / bases */
  if(d.base){ Sheets.open('base',d.base); return; }
  if(d.addbase!==undefined){ Sheets.open('base','__new__'); return; }
  if(d.bsgeo!==undefined){
    const sheet=t.closest('.sheet'), name=$('#bs-name',sheet).value.trim();
    const region=$('#bs-region',sheet).value;
    if(!name) return Shell.toast('Type the name first');
    $('#bs-geostat',sheet).textContent='Looking up…';
    const list=await Geocode.search(name+', '+REGIONS[region].country);
    if(!list.length){ $('#bs-geostat',sheet).textContent='Nothing found — paste coordinates instead'; return; }
    $('#bs-ll',sheet).value=list[0].lat.toFixed(5)+', '+list[0].lng.toFixed(5);
    $('#bs-geostat',sheet).textContent=list[0].detail||list[0].name;
    return; }
  if(d.bssave){
    const sheet=t.closest('.sheet'); const id=d.bssave;
    const region=$('#bs-region',sheet).value;
    const ll=Geocode.parseCoords($('#bs-ll',sheet).value);
    let b=S.trip.bases.find(x=>x.id===id);
    const payload={name:$('#bs-name',sheet).value||'Unnamed base',region,
      arrival:$('#bs-a',sheet).value,departure:$('#bs-d',sheet).value,
      accommodation:$('#bs-acc',sheet).value,parking:$('#bs-park',sheet).value,notes:$('#bs-notes',sheet).value};
    if(b) Object.assign(b,payload);
    else { b={id:uid('b'),...payload,source:'user'}; S.trip.bases.push(b); }
    if(ll) b.coordinates={lat:ll.lat,lng:ll.lng};
    else if(!b.coordinates) b.coordinates={...REGIONS[region].c};
    S.trip.bases.sort((x,y)=>x.arrival<y.arrival?-1:1);
    Store.save(); Shell.toast('Trip updated'); Sheets.close(); Shell.go('trip'); return; }
  if(d.bsactive){ S.activeBaseId=d.bsactive; Store.save(); Views.plans=[]; Weather.refresh(true);
    Shell.toast('Base changed'); Sheets.close(); Shell.go('home'); return; }
  if(d.bsdel){ S.trip.bases=S.trip.bases.filter(b=>b.id!==d.bsdel);
    if(S.activeBaseId===d.bsdel) S.activeBaseId=S.trip.bases[0]?.id;
    Store.save(); Sheets.close(); Shell.go('trip'); return; }

  /* ai */
  if(d.askq||d.askgo!==undefined){
    const sheet=t.closest('.sheet'), box=$('#ai-out',sheet);
    const q=d.askq||$('#ai-q',sheet).value.trim();
    if(!q) return;
    if(d.askq) $('#ai-q',sheet).value=q;
    box.innerHTML='<div class="sm mut">Thinking…</div>';
    const a=await AI.ask(q);
    box.innerHTML=`<div class="card"><div style="white-space:pre-wrap">${esc(a)}</div></div>`;
    return; }

  /* settings */
  if(d.like){ const i=S.prefs.likes.indexOf(d.like);
    i>=0?S.prefs.likes.splice(i,1):S.prefs.likes.push(d.like); Store.save(); Views.plans=[]; t.classList.toggle('on'); return; }
  if(d.keysave!==undefined){ const sheet=t.closest('.sheet');
    Config.setKey('routing',$('#st-key-routing',sheet).value.trim());
    Config.setKey('ai',$('#st-key-ai',sheet).value.trim());
    Shell.toast('Keys saved on this device'); Sheets.refresh(); return; }
  if(d.export!==undefined){
    const blob=new Blob([Store.export()],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='roadtrip-'+todayISO()+'.json'; a.click(); Shell.toast('Exported'); return; }
  if(d.reset!==undefined){ if(confirm('Reset the app and delete saved places, visits and notes?')) Store.reset(); return; }
});

/* change handlers: selects and notes */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='st-base'){ Store.s.activeBaseId=t.value; Store.save(); Views.plans=[]; Weather.refresh(true); Views.render(); Shell.toast('Base changed'); }
  if(t.id==='st-start'){ Store.s.prefs.startTime=t.value; Store.save(); }
  if(t.id==='st-end'){ Store.s.prefs.returnTime=t.value; Store.save(); }
  if(t.id==='st-drive'){ Store.s.prefs.maxDriveMin=+t.value; Store.save(); Views.plans=[]; }
  if(t.dataset.note){ Store.s.notes[t.dataset.note]=t.value; Store.save(); }
});

/* ---------- Android soft keyboard ----------
   A bottom sheet anchored to the layout viewport ends up behind the keyboard,
   which looks like the app has swapped screens. Track the visual viewport,
   lift the sheet by exactly the keyboard height, and scroll the focused field
   into view once the keyboard has finished animating. */
(function keyboard(){
  const vv=window.visualViewport;
  const sync=()=>{
    const h=vv?vv.height:window.innerHeight;
    const kb=Math.max(0,Math.round(window.innerHeight-(h+(vv?vv.offsetTop:0))));
    const r=document.documentElement.style;
    r.setProperty('--kb',kb+'px');
    r.setProperty('--sheet-max',Math.round(h*0.94)+'px');
    document.body.classList.toggle('kb',kb>120);
  };
  if(vv){ vv.addEventListener('resize',sync); vv.addEventListener('scroll',sync); }
  window.addEventListener('resize',sync);
  window.addEventListener('orientationchange',()=>setTimeout(sync,250));
  document.addEventListener('focusin',e=>{
    const f=e.target;
    if(!f||!f.matches||!f.matches('input,textarea,select')) return;
    setTimeout(()=>{ sync(); try{ f.scrollIntoView({block:'center'}); }catch(_){ } },340);
  });
  document.addEventListener('focusout',()=>setTimeout(sync,120));
  sync();
})();

/* ---------- PWA plumbing ---------- */
/* a running day re-times itself every minute, so the strip never goes stale */
setInterval(()=>{ if(Views.tab==='home'&&!Sheets._cur&&Today.isToday()) Views.render(); },60000);
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); Shell.installPrompt=e; Views.render(); });
window.addEventListener('appinstalled',()=>{ localStorage.setItem('rtc.installed','1'); Shell.toast('Installed'); });
window.addEventListener('online',()=>{ Shell.offline=false; Weather.refresh(true); Views.render(); Shell.toast('Back online'); });
window.addEventListener('offline',()=>{ Shell.offline=true; Views.render(); Shell.toast('Offline — using saved data'); });
if('serviceWorker' in navigator && location.protocol==='https:' && window.self===window.top){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- boot ---------- */
Shell.theme();
/* manifest shortcuts and deep links: #map, #ask, #parking, #events, #food, #trip */
(function hashRoute(){
  const h=(location.hash||'').replace('#','');
  if(!h) return;
  if(['home','explore','map','trip','saved'].includes(h)) Views.tab=h;
  else if(['ask','parking','events','food','planner','settings','weather','route','scanner'].includes(h))
    setTimeout(()=>Sheets.open(h),60);
})();
window.addEventListener('hashchange',()=>location.reload());
Views.render();
Weather.refresh().then(()=>{ Views.plans=[]; Views.render(); });
if(Store.s.prefs.askedLocation && Geo.status==='idle' && navigator.permissions?.query){
  navigator.permissions.query({name:'geolocation'}).then(p=>{ if(p.state==='granted') Geo.ask(); }).catch(()=>{});
}
</script>
